<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f0f10">
<title>Музыка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0f0f10; --card:#171718; --card2:#1c1c1e;
  --text:#f2f2f2; --muted:#9a9a9a; --line:#2a2a2c;
  --btn:#1e1e20; --acc:#d9d2c2; --danger:#e26d5c;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-top:env(safe-area-inset-top);
  overscroll-behavior:none;
}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer}
img{display:block}
.hidden{display:none!important}

#app{height:calc(100dvh - env(safe-area-inset-top)); display:flex; flex-direction:column}
.screen{display:none; flex:1; min-height:0; flex-direction:column}
.screen.active{display:flex; animation:fade .18s ease}
@keyframes fade{from{opacity:.35; transform:translateY(4px)}to{opacity:1; transform:none}}

/* ── Табы ── */
#tabs{display:flex; gap:22px; padding:6px 18px 0; border-bottom:1px solid var(--line)}
.tab{
  position:relative; padding:12px 2px; font-size:14px; font-weight:700;
  letter-spacing:.14em; color:var(--muted); transition:color .15s;
}
.tab.active{color:var(--text)}
.tab.active::after{
  content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px;
  background:var(--acc); border-radius:2px;
}

.pane{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 16px 20px}

.list{display:flex; flex-direction:column; gap:8px}
.empty{color:var(--muted); text-align:center; padding:44px 20px; font-size:14px}
.load-box{padding:60px 0; text-align:center; color:var(--muted)}

/* ── Плейлист (аккордеон) ── */
.pl{background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden}
.pl-head{display:flex; align-items:center; gap:12px; width:100%; padding:10px 12px; text-align:left}
.pl-cover{
  width:48px; height:48px; border-radius:12px; background:var(--card2);
  overflow:hidden; flex:none; position:relative; display:grid; place-items:center; color:#55565a;
}
.pl-cover img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.pl-cover svg{width:22px; height:22px}
.pl-info{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
.pl-name{font-weight:600; font-size:15.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pl-sub{color:var(--muted); font-size:12.5px}
.pl-acts{display:none; gap:4px; flex:none}
.pl.open .pl-acts{display:flex}
.pl-chev{color:var(--muted); flex:none; transition:transform .2s}
.pl-chev svg{width:18px; height:18px; display:block}
.pl.open .pl-chev{transform:rotate(180deg)}
.iconbtn{
  width:36px; height:36px; border-radius:10px; display:grid; place-items:center;
  color:var(--muted); background:var(--btn); flex:none;
}
.iconbtn:active{filter:brightness(1.35)}
.iconbtn svg{width:17px; height:17px; display:block}
.iconbtn.warn{color:var(--danger)}
.pl-body{border-top:1px solid var(--line)}
.pl-desc{color:var(--muted); font-size:13px; padding:10px 14px 2px}
.trk-list{max-height:36vh; overflow-y:auto; padding:6px 4px 8px}
.trk{display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:10px}
.trk:active{background:var(--card2)}
.trk-n{width:20px; text-align:right; color:var(--muted); font-size:12.5px; flex:none}
.trk-info{flex:1; min-width:0; display:flex; flex-direction:column}
.trk-t{font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.trk-a{color:var(--muted); font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.trk-d{color:var(--muted); font-size:12.5px; font-variant-numeric:tabular-nums; flex:none}
.trk.playing .trk-t{color:var(--acc)}
.trk-empty{color:var(--muted); font-size:13px; text-align:center; padding:14px}

/* строки каталога / выбора */
.cat-row, .pick-row{
  display:flex; align-items:center; gap:12px; background:var(--card);
  border:1px solid var(--line); border-radius:14px; padding:8px 10px;
}
.cat-thumb{
  width:42px; height:42px; border-radius:10px; background:var(--card2);
  overflow:hidden; flex:none; position:relative; display:grid; place-items:center; color:#55565a;
}
.cat-thumb img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.cat-thumb svg{width:18px; height:18px}
.mini-del{width:34px; height:34px; border-radius:9px; display:grid; place-items:center; color:var(--muted); flex:none}
.mini-del svg{width:16px; height:16px; display:block}
.mini-del:active{color:var(--danger); background:var(--btn)}

/* ── Нижняя панель ── */
.bottom{
  padding:10px 16px calc(14px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line); background:var(--bg);
  display:flex; gap:10px; transition:padding .18s ease;
}
body.has-mini .bottom{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.btn{
  flex:1; min-height:48px; border-radius:14px; font-weight:600; font-size:15px;
  display:flex; align-items:center; justify-content:center; gap:8px;
  transition:filter .12s, opacity .12s;
}
.btn:active{filter:brightness(1.2)}
.btn[disabled]{opacity:.4; pointer-events:none}
.btn svg{width:17px; height:17px}
.btn.primary{background:var(--text); color:#111}
.btn.secondary{background:var(--btn); color:var(--text); border:1px solid var(--line)}
.btn.ghost{background:transparent; color:var(--muted); border:1px solid var(--line)}
.btn.danger{background:rgba(226,109,92,.14); color:var(--danger)}
.btn.sq{flex:0 0 48px; width:48px}
.badge{
  background:var(--acc); color:#111; border-radius:20px; font-size:12px;
  padding:1px 8px; font-weight:700;
}

/* ── Топбар ── */
.topbar{display:flex; align-items:center; gap:6px; padding:10px 12px; border-bottom:1px solid var(--line)}
.tb-title{flex:1; text-align:center; font-weight:700; font-size:15px; letter-spacing:.04em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tb-sp{width:36px; flex:none}

/* ── Создание / редактирование ── */
.ed-wrap{flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden}
.form{padding:18px 18px 8px; display:flex; flex-direction:column; gap:12px; transition:padding .3s ease}
#scr-edit.step2 .form{padding-top:12px}
.inp{
  width:100%; background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:13px 14px; color:var(--text); font-size:15px; outline:none;
}
.inp:focus{border-color:#4a4a4e}
textarea.inp{resize:none; min-height:58px}

.coverbox{
  position:relative; width:150px; height:150px; margin:4px auto;
  display:grid; place-items:center; color:#999;
  transition:width .32s ease, height .32s ease; flex:none;
}
#scr-edit.step2 .coverbox{width:72px; height:72px}
.coverbox .dash{position:absolute; inset:0; width:100%; height:100%}
.coverbox .plus svg{width:26px; height:26px}
#scr-edit.step2 .coverbox .plus svg{width:18px; height:18px}
.coverbox img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; border-radius:14px}
.coverbox:active{filter:brightness(1.3)}

/* всплывающий лист треков (шаг 2) */
#track-sheet{
  flex:1; min-height:0; display:flex; flex-direction:column;
  max-height:0; opacity:0; transform:translateY(48px); overflow:hidden; flex:none;
  border-top:1px solid transparent;
  transition:max-height .38s ease, opacity .3s ease, transform .38s ease;
}
#scr-edit.step2 #track-sheet{
  max-height:72vh; opacity:1; transform:none; flex:1;
  border-top-color:var(--line);
}
.ed-tracks{flex:1; min-height:0; overflow-y:auto; padding:12px 16px 14px; display:flex; flex-direction:column; gap:6px}
.add-row{
  display:flex; align-items:center; gap:12px; padding:11px 12px;
  border:1.5px dashed #55565a; border-radius:12px; color:var(--muted);
  font-weight:600; font-size:14.5px; flex:none;
}
.add-row:active{filter:brightness(1.4)}
.add-row .sqic{
  width:28px; height:28px; border-radius:8px; background:var(--btn);
  display:grid; place-items:center;
}
.add-row svg{width:15px; height:15px; display:block}
.ed-tracks .trk{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:9px 12px}

/* ── Выбор треков ── */
.pick-row .chk{
  width:26px; height:26px; border-radius:50%; border:2px solid var(--muted);
  display:grid; place-items:center; color:#111; flex:none; transition:all .12s;
}
.pick-row .chk svg{width:14px; height:14px; opacity:0}
.pick-row.sel{border-color:#4a4a4e}
.pick-row.sel .chk{background:var(--acc); border-color:var(--acc)}
.pick-row.sel .chk svg{opacity:1}

/* ── Плеер ── */
#scr-player{background:radial-gradient(120% 90% at 50% 0%, #1a1a1d 0%, var(--bg) 60%)}
.player-wrap{
  flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column;
  align-items:center; padding:8px 28px 22px;
}
.p-cover{
  width:min(72vw,320px); aspect-ratio:1; border-radius:22px; margin:16px 0 20px;
  background:var(--card2); position:relative; overflow:hidden;
  display:grid; place-items:center; color:#4a4a4e;
  box-shadow:0 24px 60px rgba(0,0,0,.55); flex:none;
}
.p-cover img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.p-cover svg{width:64px; height:64px}
.p-title{
  font-size:24px; font-weight:700; text-align:center; line-height:1.2;
  max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.p-album{color:var(--muted); font-size:11px; margin-top:7px; text-align:center; letter-spacing:.04em}
.p-artist{color:var(--muted); font-size:11px; margin-top:3px; text-align:center; letter-spacing:.04em}
.p-times{display:flex; justify-content:space-between; width:100%; margin-top:6px;
  color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums}
#pbar{width:100%; height:26px; display:flex; align-items:center; cursor:pointer; margin-top:18px}
#pbar .rail{position:relative; width:100%; height:4px; border-radius:4px; background:#333336}
#pfill{position:absolute; left:0; top:0; bottom:0; width:0%; border-radius:4px; background:var(--text)}
#pfill::after{
  content:""; position:absolute; right:-6px; top:50%; transform:translateY(-50%);
  width:12px; height:12px; border-radius:50%; background:var(--text);
}
.p-controls{display:flex; align-items:center; justify-content:space-between; width:100%; margin-top:14px}
.pc-btn{width:52px; height:52px; display:grid; place-items:center; color:var(--muted); border-radius:50%}
.pc-btn svg{width:24px; height:24px}
.pc-btn.on{color:var(--acc)}
.pc-btn:active{filter:brightness(1.4)}
#btn-play{width:68px; height:68px; border-radius:50%; background:var(--text); color:#111; display:grid; place-items:center}
#btn-play svg{width:30px; height:30px}

/* ── Мини-плеер ── */
#mini{
  position:fixed; left:10px; right:10px;
  bottom:calc(10px + env(safe-area-inset-bottom));
  height:60px; border-radius:16px; background:rgba(28,28,30,.92);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line); display:flex; align-items:center; gap:10px;
  padding:6px 10px; z-index:40; box-shadow:0 10px 30px rgba(0,0,0,.5);
  animation:fade .18s ease;
}
#mini .cat-thumb{width:44px; height:44px; border-radius:11px}
#mini .trk-t{font-size:14px}
#mini .pc-btn{width:42px; height:42px; color:var(--text)}

/* ── Тост / Модалка ── */
#toast{
  position:fixed; left:50%; bottom:calc(86px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(8px); background:#262628; color:var(--text);
  border:1px solid var(--line); padding:10px 16px; border-radius:12px; font-size:13.5px;
  opacity:0; pointer-events:none; transition:all .2s; z-index:60; max-width:86vw; text-align:center;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
.ov{
  position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:50;
  display:grid; place-items:center; padding:30px; animation:fade .15s ease;
}
.dlg{width:100%; max-width:320px; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px}
.dlg-t{font-weight:700; font-size:16px}
.dlg-x{color:var(--muted); font-size:13.5px; margin-top:6px}
.dlg-btns{display:flex; gap:10px; margin-top:18px}
.dlg-btns .btn{min-height:42px; font-size:14px}
</style>
</head>
<body>
<div id="app">

  <!-- ═══════ ГЛАВНАЯ ═══════ -->
  <section id="scr-home" class="screen active">
    <header id="tabs">
      <button id="tab-pl" class="tab active">ПЛЕЙЛИСТЫ</button>
      <button id="tab-cat" class="tab">ВСЕ ТРЕКИ</button>
    </header>

    <div id="pane-pl" class="pane">
      <div id="pl-list" class="list"></div>
      <div id="pl-empty" class="empty hidden">Плейлистов пока нет</div>
      <div id="home-loading" class="load-box">Загрузка…</div>
      <div id="home-err" class="empty hidden">
        Не удалось подключиться<br>
        <span id="home-err-text" style="font-size:12.5px">Сервер просыпается, это занимает до минуты</span><br><br>
        <button class="btn secondary" id="btn-retry" style="max-width:220px;margin:0 auto">Повторить</button>
      </div>
    </div>

    <div id="pane-cat" class="pane hidden">
      <div id="cat-list" class="list"></div>
      <div id="cat-empty" class="empty hidden">Треков пока нет</div>
    </div>

    <div class="bottom" id="bt-pl">
      <button id="btn-create" class="btn primary"><span id="ic-plus1"></span>Создать плейлист</button>
    </div>
    <div class="bottom hidden" id="bt-cat">
      <button id="btn-upload" class="btn secondary sq"><span id="ic-up1"></span></button>
      <button id="btn-load" class="btn primary"><span id="ic-down1"></span>Импортировать треки<span id="pending-badge" class="badge hidden"></span></button>
    </div>
  </section>

  <!-- ═══════ СОЗДАНИЕ / РЕДАКТИРОВАНИЕ ═══════ -->
  <section id="scr-edit" class="screen">
    <div class="topbar">
      <button class="iconbtn" data-back><span id="ic-back2"></span></button>
      <div class="tb-title" id="ed-title">Новый плейлист</div><span class="tb-sp"></span>
    </div>
    <div class="ed-wrap">
      <div class="form">
        <div class="coverbox" id="ed-cover">
          <svg class="dash" viewBox="0 0 100 100" preserveAspectRatio="none">
            <rect x="2" y="2" width="96" height="96" rx="14" fill="none" stroke="#999"
                  stroke-width="1.2" stroke-dasharray="12 9" stroke-linecap="butt"/>
          </svg>
          <span class="plus" id="ic-plus3"></span>
          <img id="ed-cover-img" class="hidden" alt="">
        </div>
        <input class="inp" id="ed-name" type="text" placeholder="Название" maxlength="60">
        <textarea class="inp" id="ed-desc" placeholder="Описание" maxlength="300"></textarea>
      </div>
      <div id="track-sheet">
        <div class="ed-tracks" id="ed-tracks"></div>
      </div>
    </div>
    <div class="bottom" id="ed-bottom1">
      <button id="ed-next" class="btn primary" disabled>Далее</button>
    </div>
    <div class="bottom hidden" id="ed-bottom2">
      <button id="ed-cancel" class="btn ghost">Отмена</button>
      <button id="ed-save" class="btn primary">Создать</button>
    </div>
  </section>

  <!-- ═══════ ВЫБОР ТРЕКОВ ═══════ -->
  <section id="scr-pick" class="screen">
    <div class="topbar">
      <button class="iconbtn" data-back><span id="ic-back3"></span></button>
      <div class="tb-title">Все треки</div><span class="tb-sp"></span>
    </div>
    <div class="pane">
      <div id="pick-list" class="list"></div>
      <div id="pick-empty" class="empty hidden">Список пуст</div>
    </div>
    <div class="bottom">
      <button id="pk-import" class="btn secondary sq"><span id="ic-down2"></span></button>
      <button id="pk-upload" class="btn secondary sq"><span id="ic-up2"></span></button>
      <button id="pick-apply" class="btn primary" disabled>Добавить выбранные</button>
    </div>
  </section>

  <!-- ═══════ ПЛЕЕР ═══════ -->
  <section id="scr-player" class="screen">
    <div class="topbar" style="border-color:transparent">
      <button class="iconbtn" data-back style="background:transparent"><span id="ic-cd"></span></button>
      <div class="tb-title" id="p-source" style="font-weight:600;font-size:11px;letter-spacing:.14em;color:var(--muted)"></div>
      <span class="tb-sp"></span>
    </div>
    <div class="player-wrap">
      <div class="p-cover"><span id="ic-note"></span><img id="p-img" class="hidden" alt=""></div>
      <div class="p-title" id="p-title">—</div>
      <div class="p-album" id="p-album"></div>
      <div class="p-artist" id="p-artist"></div>
      <div id="pbar"><div class="rail"><div id="pfill"></div></div></div>
      <div class="p-times"><span id="p-cur">0:00</span><span id="p-dur">0:00</span></div>
      <div class="p-controls">
        <button class="pc-btn" id="btn-repeat"></button>
        <button class="pc-btn" id="btn-prev"></button>
        <button id="btn-play"></button>
        <button class="pc-btn" id="btn-next"></button>
        <button class="pc-btn" id="btn-order"></button>
      </div>
    </div>
  </section>

</div>

<!-- Мини-плеер -->
<div id="mini" class="hidden">
  <div class="cat-thumb"><span id="ic-note2"></span><img id="m-img" class="hidden" alt=""></div>
  <div class="trk-info" style="flex:1;min-width:0">
    <div class="trk-t" id="m-title">—</div>
    <div class="trk-a" id="m-artist"></div>
  </div>
  <button class="pc-btn" id="m-play"></button>
</div>

<div id="modal-root"></div>
<div id="toast"></div>

<input type="file" id="fi-cover" accept="image/*" class="hidden">
<input type="file" id="fi-audio" accept="audio/*" multiple class="hidden">
<audio id="audio" preload="auto"></audio>

<script>
"use strict";
/* ═══════════════ База ═══════════════ */
const API = "https://music-player-server-jjkm.onrender.com";
const tg = (window.Telegram && window.Telegram.WebApp) || null;
try { if (tg) { tg.ready(); tg.expand(); } } catch (e) {}
const INIT_DATA = (tg && tg.initData) || "";

const $ = (s) => document.querySelector(s);
const audio = $("#audio");

const S = {
  tab: "pl", playlists: {}, catalog: [], pendingCount: 0,
  expanded: null, screen: "home", playerFrom: "home",
  draft: null, pick: new Set(), uploadCtx: "cat",
  pl: { queue: [], i: -1, source: "", order: 0, repeat: 0 },
  // order: 0 — обычный, 1 — перемешать, 2 — обратный
  // repeat: 0 — выкл, 1 — весь плейлист, 2 — один трек
};

/* ═══════════════ Иконки (Lucide, инлайн) ═══════════════ */
const w = (inner) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + inner + "</svg>";
const SHUFFLE_PATHS = '<polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/>';
const I = {
  plus: w('<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>'),
  check: w('<polyline points="20 6 9 17 4 12"/>'),
  chevD: w('<polyline points="6 9 12 15 18 9"/>'),
  chevL: w('<polyline points="15 18 9 12 15 6"/>'),
  pencil: w('<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/>'),
  trash: w('<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>'),
  music: w('<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>'),
  upload: w('<polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>'),

/* ═══════════════ Утилиты ═══════════════ */
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
));
const enc = encodeURIComponent;
function fmt(sec) {
  sec = Math.max(0, Math.round(sec || 0));
  if (!sec) return "";
  return Math.floor(sec / 60) + ":" + String(Math.floor(sec % 60)).padStart(2, "0");
}
function plural(n, a, b, c) {
  const m = n % 100, d = n % 10;
  if (m > 10 && m < 20) return c;
  if (d > 1 && d < 5) return b;
  if (d === 1) return a;
  return c;
}
function resolveMedia(u) {
  if (!u) return "";
  if (/^https?:/i.test(u) || u.startsWith("data:")) return u;
  return API + u;
}
let toastT = null;
function toast(msg) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove("show"), 2200);
}
function humanErr(e) {
  const m = String((e && e.message) || e || "");
  if (m.includes("Failed to fetch") || m.includes("NetworkError")) return "Сервер просыпается, попробуй ещё раз";
  if (m === "exists") return "Плейлист с таким названием уже есть";
  return m || "Ошибка";
}
function confirmDlg(title, text, okText) {
  const root = $("#modal-root");
  return new Promise((res) => {
    root.innerHTML =
      '<div class="ov"><div class="dlg">' +
      '<div class="dlg-t">' + esc(title) + "</div>" +
      (text ? '<div class="dlg-x">' + esc(text) + "</div>" : "") +
      '<div class="dlg-btns">' +
      '<button class="btn ghost" id="m-no">Отмена</button>' +
      '<button class="btn danger" id="m-yes">' + esc(okText || "Удалить") + "</button>" +
      "</div></div></div>";
    const close = (v) => { root.innerHTML = ""; res(v); };
    $("#m-no").onclick = () => close(false);
    $("#m-yes").onclick = () => close(true);
    root.querySelector(".ov").addEventListener("click", (e) => {
      if (e.target.classList.contains("ov")) close(false);
    });
  });
}
function longPress(el, cb) {
  let t = null, fired = false;
  el.addEventListener("pointerdown", (e) => {
    fired = false;
    t = setTimeout(() => { fired = true; try { if (navigator.vibrate) navigator.vibrate(10); } catch (_) {} cb(e); }, 500);
  });
  ["pointerup", "pointerleave", "pointercancel", "pointermove"].forEach((ev) =>
    el.addEventListener(ev, () => clearTimeout(t))
  );
  el.addEventListener("click", (e) => {
    if (fired) { e.preventDefault(); e.stopPropagation(); fired = false; }
  }, true);
}

/* ═══════════════ API ═══════════════ */
function qs() { return INIT_DATA ? "init_data=" + enc(INIT_DATA) : "test_user=12345"; }
async function api(path, opt) {
  opt = opt || {};
  const m = opt.method || "GET";
  const url = API + path + (path.includes("?") ? "&" : "?") + qs();
  const init = { method: m, headers: {} };
  if (opt.body !== undefined) {
    init.headers["Content-Type"] = "application/json";
    const extra = INIT_DATA ? { init_data: INIT_DATA } : { test_user: 12345 };
    init.body = JSON.stringify(Object.assign({}, opt.body, extra));
  }
  const r = await fetch(url, init);
  if (!r.ok) {
    let msg = "Ошибка " + r.status;
    try { const j = await r.json(); if (j && j.error) msg = j.error; } catch (_) {}
    throw new Error(msg);
  }
  return r.json();
}

/* ═══════════════ Плейлисты ═══════════════ */
function coverInner(url) {
  const u = resolveMedia(url);
  return '<span style="display:grid;place-items:center">' + I.music + "</span>" +
    (u ? '<img src="' + u + '" onerror="this.remove()" alt="">' : "");
}
function plBodyHtml(p) {
  const desc = p.description ? '<div class="pl-desc">' + esc(p.description) + "</div>" : "";
  const rows = (p.tracks || []).map((t, i) =>
    '<div class="trk" data-i="' + i + '" data-fid="' + esc(t.file_id) + '">' +
    '<span class="trk-n">' + (i + 1) + "</span>" +
    '<span class="trk-info"><span class="trk-t">' + esc(t.title) + "</span>" +
    '<span class="trk-a">' + (esc(t.artist) || "—") + "</span></span>" +
    '<span class="trk-d">' + fmt(t.duration) + "</span></div>"
  ).join("");
  return desc + '<div class="trk-list">' +
    (rows || '<div class="trk-empty">Пока пусто</div>') +
    "</div>";
}
function renderPlaylists() {
  const list = $("#pl-list");
  list.innerHTML = "";
  const names = Object.keys(S.playlists);
  $("#pl-empty").classList.toggle("hidden", names.length > 0);
  names.forEach((name) => {
    const p = S.playlists[name];
    const open = S.expanded === name;
    const fallback = (p.tracks || []).find((t) => t.thumb_url);
    const el = document.createElement("div");
    el.className = "pl" + (open ? " open" : "");
    el.innerHTML =
      '<button class="pl-head">' +
      '<span class="pl-cover">' + coverInner(p.cover || (fallback && fallback.thumb_url)) + "</span>" +
      '<span class="pl-info"><span class="pl-name">' + esc(name) + "</span>" +
      '<span class="pl-sub">' + (p.tracks || []).length + " " + plural((p.tracks || []).length, "трек", "трека", "треков") + "</span></span>" +
      '<span class="pl-acts">' +
      '<span class="iconbtn act-edit">' + I.pencil + "</span>" +
      '<span class="iconbtn warn act-del">' + I.trash + "</span>" +
      "</span>" +
      '<span class="pl-chev">' + I.chevD + "</span>" +
      "</button>" +
      (open ? '<div class="pl-body">' + plBodyHtml(p) + "</div>" : "");
    el.querySelector(".pl-head").addEventListener("click", (e) => {
      if (e.target.closest(".act-edit") || e.target.closest(".act-del")) return;
      S.expanded = open ? null : name;
      renderPlaylists(); markPlaying();
    });
    el.querySelector(".act-edit").addEventListener("click", () => openEdit(name));
    el.querySelector(".act-del").addEventListener("click", async () => {
      const ok = await confirmDlg("Удалить плейлист?", "«" + name + "»", "Удалить");
      if (!ok) return;
      try {
        await api("/api/playlist/" + enc(name), { method: "DELETE" });
        delete S.playlists[name];
        if (S.expanded === name) S.expanded = null;
        renderPlaylists(); markPlaying();
        toast("Плейлист удалён");
      } catch (e) { toast(humanErr(e)); }
    });
    if (open) {
      el.querySelectorAll(".trk").forEach((row) => {
        row.addEventListener("click", () => {
          playQueue(p.tracks, Number(row.dataset.i), "«" + name + "»");
        });
      });
    }
    list.appendChild(el);
  });
}

/* Загрузка с устройства */
async function uploadAudioFiles(files) {
  for (const f of files) {
    toast("Загружаю «" + f.name + "»…");
    try {
      const fd = new FormData();
      fd.append("file", f);
      const r = await fetch(API + "/api/upload/audio?" + qs(), { method: "POST", body: fd });

      if (!r.ok || !j.track) throw new Error(j.error || "Ошибка загрузки");

/* ═══════════════ Плеер ═══════════════ */
function playQueue(tracks, i, source) {
  if (!tracks || !tracks.length) return;
  S.pl.queue = tracks.slice();
  S.pl.source = source || "";
  if (S.screen !== "player") S.playerFrom = S.screen;
  playAt(i);
  renderPlayer();
  show("player");
}
function playAt(i) {
  const p = S.pl;
  if (i < 0 || i >= p.queue.length) return;
  p.i = i;
  const t = p.queue[i];
  const src = resolveMedia(t.audio_url);
  if (audio.src !== src) audio.src = src;
  const pr = audio.play();
  if (pr && pr.catch) pr.catch(() => {});
  renderPlayer();
  markPlaying();
}
function curTrack() { const p = S.pl; return p.i >= 0 ? p.queue[p.i] : null; }
function onEnded() {
  const p = S.pl;
  if (p.repeat === 2) { audio.currentTime = 0; audio.play().catch(() => {}); return; }
  nextTrack(true);
}
function nextTrack(auto) {
  const p = S.pl;
  if (!p.queue.length) return;
  let i;
  if (p.order === 1 && p.queue.length > 1) {
    do { i = Math.floor(Math.random() * p.queue.length); } while (i === p.i);
  } else {
    const dir = p.order === 2 ? -1 : 1;
    i = p.i + dir;
    if (i >= p.queue.length || i < 0) {
      if (auto && p.repeat !== 1) {
        p.i = 0; audio.pause(); audio.currentTime = 0;
        renderPlayer(); return;
      }
      i = (i >= p.queue.length) ? 0 : p.queue.length - 1;
    }
  }
  playAt(i);
}
function prevTrack() {
  const p = S.pl;
  if (!p.queue.length) return;
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  const dir = p.order === 2 ? 1 : -1;
  let i = p.i + dir;
  if (i < 0) i = p.queue.length - 1;
  if (i >= p.queue.length) i = 0;
  playAt(i);
}
function toggleRepeat() {
  S.pl.repeat = (S.pl.repeat + 1) % 3;
  renderPlayerControls();
  toast(S.pl.repeat === 0 ? "Повтор выключен" : S.pl.repeat === 1 ? "Повторять плейлист" : "Повторять трек");
}
function toggleOrder() {
  S.pl.order = (S.pl.order + 1) % 3;
  renderPlayerControls();
  toast(S.pl.order === 1 ? "Перемешивание" : S.pl.order === 2 ? "Обратный порядок" : "Обычный порядок");
}
function renderPlayer() {
  const t = curTrack();
  $("#p-source").textContent = S.pl.source ? S.pl.source.toUpperCase() : "";
  const img = $("#p-img");
  if (t && t.thumb_url) { img.src = resolveMedia(t.thumb_url); img.classList.remove("hidden"); }
  else img.classList.add("hidden");
  $("#p-title").textContent = t ? t.title : "—";
  $("#p-album").textContent = t && t.album ? t.album : "";
  $("#p-artist").textContent = t && t.artist ? t.artist : "";
  $("#p-dur").textContent = isFinite(audio.duration) && audio.duration ? fmt(audio.duration) : fmt(t && t.duration) || "0:00";
  renderPlayerControls();
  updateMini();
}
function renderPlayerControls() {
  $("#btn-play").innerHTML = audio.paused ? I.play : I.pause;
  $("#m-play").innerHTML = audio.paused ? I.play : I.pause;
  const rs = $("#btn-repeat");
  rs.innerHTML = S.pl.repeat === 2 ? I.repeat1 : I.repeat;
  rs.classList.toggle("on", S.pl.repeat > 0);
  const ob = $("#btn-order");
  ob.innerHTML = S.pl.order === 2 ? I.shuffleFlip : I.shuffle;
  ob.classList.toggle("on", S.pl.order > 0);
}
function markPlaying() {
  const t = curTrack();
  const fid = t ? t.file_id : null;
  document.querySelectorAll(".trk.playing").forEach((el) => el.classList.remove("playing"));
  if (!fid) return;
  document.querySelectorAll('.trk[data-fid="' + CSS.escape(fid) + '"]').forEach((el) => el.classList.add("playing"));
}
function updateProgress() {
  const t = curTrack();
  const d = isFinite(audio.duration) ? audio.duration : (t ? t.duration : 0);
  const c = audio.currentTime || 0;
  $("#p-cur").textContent = fmt(c) || "0:00";
  $("#p-dur").textContent = fmt(d) || "0:00";
  $("#pfill").style.width = d ? (c / d * 100).toFixed(2) + "%" : "0%";
}
function updateMini() {
  const t = curTrack();
  const mini = $("#mini");
  const showMini = !!t && S.screen !== "player";
  mini.classList.toggle("hidden", !showMini);
  document.body.classList.toggle("has-mini", showMini);
  if (!showMini) return;
  $("#m-title").textContent = t.title;
  $("#m-artist").textContent = t.artist || "";
  const img = $("#m-img");
  if (t.thumb_url) { img.src = resolveMedia(t.thumb_url); img.classList.remove("hidden"); }
  else img.classList.add("hidden");
  $("#m-play").innerHTML = audio.paused ? I.play : I.pause;
}
function togglePlay() {
  const t = curTrack();
  if (!t) return;
  if (audio.paused) { const pr = audio.play(); if (pr && pr.catch) pr.catch(() => {}); }
  else audio.pause();
  renderPlayerControls(); updateMini();
}

/* ═══════════════ Привязки ═══════════════ */
function bindAll() {
  $("#ic-plus1").innerHTML = I.plus; $("#ic-plus3").innerHTML = I.plus;
  $("#ic-back2").innerHTML = I.chevL; $("#ic-back3").innerHTML = I.chevL;
  $("#ic-cd").innerHTML = I.chevD;
  $("#ic-up1").innerHTML = I.upload; $("#ic-up2").innerHTML = I.upload;
  $("#ic-down1").innerHTML = I.download; $("#ic-down2").innerHTML = I.download;
  $("#ic-note").innerHTML = I.music; $("#ic-note2").innerHTML = I.music;
  $("#btn-prev").innerHTML = I.prev; $("#btn-next").innerHTML = I.next;
  renderPlayerControls();

  $("#tab-pl").addEventListener("click", () => setTab("pl"));
  $("#tab-cat").addEventListener("click", () => setTab("cat"));

  $("#btn-create").addEventListener("click", openCreate);
  $("#btn-load").addEventListener("click", () => importFromBot(null));
  $("#btn-upload").addEventListener("click", () => { S.uploadCtx = "cat"; $("#fi-audio").click(); });
  $("#btn-retry").addEventListener("click", () => loadAll(true));

  /* создание / редактирование */
  $("#ed-name").addEventListener("input", (e) => { $("#ed-next").disabled = !e.target.value.trim(); });
  $("#ed-next").addEventListener("click", () => {
    const name = $("#ed-name").value.trim();
    if (!name) return;
    if (S.draft.mode === "create" && S.playlists[name]) { toast("Плейлист с таким названием уже есть"); return; }
    S.draft.name = name;
    S.draft.description = $("#ed-desc").value.trim();
    $("#scr-edit").classList.add("step2");
    $("#ed-bottom1").classList.add("hidden");
    $("#ed-bottom2").classList.remove("hidden");
    $("#ed-name").blur(); $("#ed-desc").blur();
  });
  $("#ed-save").addEventListener("click", saveDraft);
  $("#ed-cancel").addEventListener("click", goBack);
  $("#ed-cover").addEventListener("click", () => $("#fi-cover").click());
  $("#fi-cover").addEventListener("change", () => {
    const f = $("#fi-cover").files[0];
    $("#fi-cover").value = "";
    if (!f) return;
    const img = new Image();
    img.onload = () => {
      const s = 512, c = document.createElement("canvas");
      c.width = s; c.height = s;
      const x = c.getContext("2d");
      const sc = Math.max(s / img.width, s / img.height);
      const w2 = img.width * sc, h2 = img.height * sc;
      x.drawImage(img, (s - w2) / 2, (s - h2) / 2, w2, h2);
      const data = c.toDataURL("image/jpeg", 0.82);
      if (S.draft) S.draft.cover = data;
      const pv = $("#ed-cover-img");
      pv.src = data; pv.classList.remove("hidden");
      $("#ed-cover").querySelector(".plus").classList.add("hidden");
      URL.revokeObjectURL(img.src);
    };
    img.src = URL.createObjectURL(f);
  });

  /* выбор треков */
  $("#pick-apply").addEventListener("click", applyPick);
  $("#pk-import").addEventListener("click", () => importFromBot(renderPick));
  $("#pk-upload").addEventListener("click", () => { S.uploadCtx = "pick"; $("#fi-audio").click(); });
  $("#fi-audio").addEventListener("change", (e) => {
    const files = Array.from(e.target.files || []);
    e.target.value = "";
    if (files.length) uploadAudioFiles(files);
  });

  /* кнопки «назад» */
  document.querySelectorAll("[data-back]").forEach((b) => b.addEventListener("click", goBack));

  /* плеер */
  $("#btn-play").addEventListener("click", togglePlay);
  $("#m-play").addEventListener("click", (e) => { e.stopPropagation(); togglePlay(); });
  $("#btn-next").addEventListener("click", () => nextTrack(false));
  $("#btn-prev").addEventListener("click", prevTrack);
  $("#btn-repeat").addEventListener("click", toggleRepeat);
  $("#btn-order").addEventListener("click", toggleOrder);
  $("#mini").addEventListener("click", (e) => {
    if (e.target.closest("#m-play")) return;
    S.playerFrom = S.screen === "player" ? S.playerFrom : S.screen;
    show("player");
    renderPlayer();
  });

  /* прогресс-бар */
  const bar = $("#pbar");
  let seeking = false;
  const seekEv = (e) => {
    const r = bar.getBoundingClientRect();
    const ratio = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    const t = curTrack();
    const d = isFinite(audio.duration) ? audio.duration : (t ? t.duration : 0);
    if (d) audio.currentTime = ratio * d;
    updateProgress();
  };
  bar.addEventListener("pointerdown", (e) => { seeking = true; try { bar.setPointerCapture(e.pointerId); } catch (_) {} seekEv(e); });
  bar.addEventListener("pointermove", (e) => { if (seeking) seekEv(e); });
  bar.addEventListener("pointerup", () => { seeking = false; });
  bar.addEventListener("pointercancel", () => { seeking = false; });

  /* audio-события */
  audio.addEventListener("play", () => { renderPlayerControls(); updateMini(); });
  audio.addEventListener("pause", () => { renderPlayerControls(); updateMini(); });
  audio.addEventListener("timeupdate", updateProgress);
  audio.addEventListener("loadedmetadata", updateProgress);
  audio.addEventListener("ended", onEnded);
  audio.addEventListener("error", () => { if (curTrack()) toast("Не удалось воспроизвести трек"); });
}

/* ═══════════════ Старт ═══════════════ */
bindAll();
show("home");
loadAll(true);
</script>
</body>
</html>
