<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Music Player</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; padding: 16px; }
    .box { border: 1px solid #ddd; border-radius: 12px; padding: 12px; margin: 12px 0; }
    button { padding: 10px 12px; border-radius: 10px; border: 1px solid #ccc; background: #fff; cursor: pointer; }
    .pl { display:flex; justify-content:space-between; align-items:center; padding: 10px 0; border-bottom:1px solid #eee; }
    .muted { color:#666; font-size: 13px; }
  </style>
</head>
<body>
  <h2>Плейлисты</h2>
  <div class="box" id="status" class="muted">Загрузка…</div>
  <div class="box" id="playlists"></div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const API_BASE = "https://music-player-server-jjkm.onrender.com";

  async function loadPlaylists() {
    const status = document.getElementById("status");
    const plBox = document.getElementById("playlists");

    try {
      const url = API_BASE + "/api/playlists?init_data=" + encodeURIComponent(tg.initData);
      const res = await fetch(url);
      const data = await res.json();

      if (!res.ok) {
        status.textContent = "Ошибка: " + (data.error || res.status);
        return;
      }

      const names = Object.keys(data);
      status.textContent = names.length ? "Готово" : "Плейлисты не найдены";
      plBox.innerHTML = "";

      names.forEach(name => {
        const count = (data[name].tracks || []).length;
        const row = document.createElement("div");
        row.className = "pl";

        const left = document.createElement("div");
        left.innerHTML = "<b>" + name + "</b><div class='muted'>" + count + " тр.</div>";

        const btn = document.createElement("button");
        btn.textContent = "Открыть";
        btn.onclick = () => alert("Дальше сделаем выездную панель треков для: " + name);

        row.appendChild(left);
        row.appendChild(btn);
        plBox.appendChild(row);
      });

    } catch (e) {
      status.textContent = "Ошибка сети: " + e;
    }
  }

  loadPlaylists();
</script>
</body>
</html>
