<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Music Player</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{
      --bg:#0f0f10;
      --card:#171718;
      --text:#f2f2f2;
      --muted:#9a9a9a;
      --line:#2a2a2c;
      --btn:#1e1e20;
      --danger:#ff5a5a;
      --inner:#131314;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      background:var(--bg);
      color:var(--text);
      height:100vh;
      overflow:hidden;
    }

    .header{
      height:56px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:700;
      letter-spacing:1px;
      text-transform:uppercase;
      border-bottom:1px solid var(--line);
      user-select:none;
      cursor:pointer;
    }

    .wrap{
      height:calc(100vh - 56px);
      overflow:auto;
      padding:14px 14px 90px;
    }

    /* playlist row */
    .pl-block{
      margin-bottom:10px;
    }
    .pl{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:14px;
      padding:10px;
      display:flex;
      align-items:center;
      gap:10px;
      user-select:none;
      cursor:pointer;
    }
    .pl.active{
      border-bottom-left-radius:0;
      border-bottom-right-radius:0;
      border-bottom-color:transparent;
    }
    .pl-cover{
      width:50px;
      height:50px;
      border-radius:12px;
      background:#222;
      overflow:hidden;
      flex:0 0 50px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--muted);
      font-size:20px;
    }
    .pl-cover img{width:100%;height:100%;object-fit:cover}
    .pl-info{min-width:0;flex:1}
    .pl-name{
      font-weight:650;
      font-size:15px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .pl-count{
      margin-top:2px;
      color:var(--muted);
      font-size:12px;
    }

    /* inline action buttons */
    .pl-actions{
      display:none;
      gap:6px;
      flex:0 0 auto;
      align-items:center;
    }
    .pl.active .pl-actions{display:flex}
    .pl-btn{
      width:38px;
      height:38px;
      border-radius:10px;
      background:var(--btn);
      border:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:16px;
      cursor:pointer;
      user-select:none;
    }
    .pl-btn:active{opacity:.8}

    /* dropdown tracks */
    .pl-dropdown{
      display:none;
      background:var(--inner);
      border:1px solid var(--line);
      border-top:none;
      border-bottom-left-radius:14px;
      border-bottom-right-radius:14px;
      padding:6px 6px 10px;
      max-height:45vh;
      overflow:auto;
    }
    .pl-dropdown.open{display:block}

    .trk{
      display:flex;
      align-items:center;
      gap:10px;
      padding:9px 10px;
      border-radius:10px;
      cursor:pointer;
    }
    .trk:active{background:#1a1a1c}
    .trk-num{width:22px;color:var(--muted);text-align:center;font-size:13px}
    .trk-info{min-width:0;flex:1}
    .trk-title{
      font-size:14px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .trk-artist{
      font-size:12px;
      color:var(--muted);
      margin-top:1px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .trk-dur{color:var(--muted);font-size:12px;flex:0 0 auto}

    .empty{
      color:var(--muted);
      text-align:center;
      padding:20px 10px;
      line-height:1.6;
      font-size:13px;
    }

    .create{
      position:fixed;
      left:14px;
      right:14px;
      bottom:14px;
      height:54px;
      border-radius:16px;
      background:var(--btn);
      border:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:650;
      font-size:15px;
      user-select:none;
      cursor:pointer;
      z-index:10;
    }

    /* modal create */
    .modal-backdrop{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.55);
      opacity:0;
      pointer-events:none;
      transition:opacity .16s;
      z-index:80;
    }
    .modal-backdrop.show{opacity:1;pointer-events:auto}
    .modal{
      position:fixed;
      left:14px;
      right:14px;
      top:50%;
      transform:translateY(30px);
      opacity:0;
      pointer-events:none;
      transition:opacity .16s,transform .16s;
      z-index:90;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      padding:14px;
    }
    .modal.show{
      transform:translateY(-50%);
      opacity:1;
      pointer-events:auto;
    }
    .modal-title{
      font-weight:750;
      margin-bottom:12px;
      text-align:center;
    }
    .cover-pick{
      width:110px;
      height:110px;
      border-radius:18px;
      border:2px dashed #999;
      margin:0 auto 14px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#999;
      user-select:none;
      cursor:pointer;
      overflow:hidden;
    }
    .cover-pick img{width:100%;height:100%;object-fit:cover}
    .cover-plus{font-size:34px;line-height:1}
    .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
    .label{font-size:12px;color:var(--muted)}
    input[type="text"]{
      height:46px;
      border-radius:14px;
      border:1px solid var(--line);
      background:#121213;
      color:var(--text);
      padding:0 12px;
      outline:none;
      font-size:15px;
    }
    .row-btns{display:flex;gap:10px}
    .btn{
      flex:1;
      height:46px;
      border-radius:14px;
      border:1px solid var(--line);
      background:var(--btn);
      color:var(--text);
      font-weight:650;
      font-size:14px;
      cursor:pointer;
    }
    .btn:active{opacity:.9}
    .btn.primary{background:#2a2a2d}
    .btn.danger{border-color:#3a2a2a;color:var(--danger)}
    .err{color:var(--danger);font-size:12px;text-align:center;min-height:16px;margin-top:2px}
  </style>
</head>
<body>

  <div class="header" id="header">ПЛЕЙЛИСТЫ</div>
  <div class="wrap" id="list"></div>
  <div class="create" id="btnCreate">+ Создать плейлист</div>

  <!-- Modal: create playlist step 1 -->
  <div class="modal-backdrop" id="mBack"></div>
  <div class="modal" id="mCreate">
    <div class="modal-title">Создать плейлист</div>
    <div class="cover-pick" id="coverPick">
      <div class="cover-plus" id="coverPlus">+</div>
      <img id="coverImg" style="display:none" />
    </div>
    <input id="coverFile" type="file" accept="image/*" style="display:none" />
    <div class="field">
      <div class="label">Название (обязательно)</div>
      <input type="text" id="plName" placeholder="Название плейлиста" />
      <div class="err" id="plErr"></div>
    </div>
    <div class="row-btns">
      <button class="btn danger" id="plCancel">Отмена</button>
      <button class="btn primary" id="plNext">Далее</button>
    </div>
  </div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const API_BASE = "https://music-player-server-jjkm.onrender.com";

  let playlists = {};
  let openPl = null;
  let createCoverFile = null;

  function qs(id){ return document.getElementById(id); }

  function fmt(sec){
    sec = Math.floor(sec||0);
    return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;
  }

  async function apiGet(path){
    const sep = path.includes("?")?"&":"?";
    const r = await fetch(API_BASE+path+sep+"init_data="+encodeURIComponent(tg.initData));
    const j = await r.json();
    if(!r.ok) throw new Error(j.error||"api");
    return j;
  }
  async function apiPost(path,body){
    const r = await fetch(API_BASE+path+"?init_data="+encodeURIComponent(tg.initData),{
      method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})
    });
    const j = await r.json();
    if(!r.ok) throw new Error(j.error||"api");
    return j;
  }
  async function apiDelete(path,body){
    const r = await fetch(API_BASE+path+"?init_data="+encodeURIComponent(tg.initData),{
      method:"DELETE",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})
    });
    const j = await r.json();
    if(!r.ok) throw new Error(j.error||"api");
    return j;
  }

  async function load(){
    qs("list").innerHTML = `<div class="empty">Загрузка…</div>`;
    try{
      playlists = await apiGet("/api/playlists");
      renderPlaylists();
    }catch(e){
      qs("list").innerHTML = `<div class="empty">Ошибка загрузки</div>`;
    }
  }

  function renderPlaylists(){
    const list = qs("list");
    const names = Object.keys(playlists);

    if(!names.length){
      list.innerHTML = `<div class="empty">Плейлисты не найдены</div>`;
      return;
    }

    list.innerHTML = "";
    names.forEach(name=>{
      const pl = playlists[name];
      const tracks = pl.tracks||[];
      const isOpen = openPl===name;

      // wrapper
      const block = document.createElement("div");
      block.className = "pl-block";

      // row
      const row = document.createElement("div");
      row.className = "pl"+(isOpen?" active":"");

      const cover = document.createElement("div");
      cover.className = "pl-cover";
      if(pl.cover_url){
        const img = document.createElement("img");
        img.src = pl.cover_url;
        cover.appendChild(img);
      } else {
        cover.textContent = "♪";
      }

      const info = document.createElement("div");
      info.className = "pl-info";
      info.innerHTML = `<div class="pl-name">${name}</div><div class="pl-count">${tracks.length} тр.</div>`;

      const actions = document.createElement("div");
      actions.className = "pl-actions";

      const btnEdit = document.createElement("div");
      btnEdit.className = "pl-btn";
      btnEdit.textContent = "✏️";
      btnEdit.addEventListener("click",(e)=>{
        e.stopPropagation();
        alert("Редактирование — следующий шаг");
      });

      const btnDel = document.createElement("div");
      btnDel.className = "pl-btn";
      btnDel.textContent = "🗑️";
      btnDel.addEventListener("click",async(e)=>{
        e.stopPropagation();
        if(confirm(`Удалить «${name}»?`)){
          await apiDelete(`/api/playlist/${encodeURIComponent(name)}`);
          openPl = null;
          await load();
        }
      });

      actions.appendChild(btnEdit);
      actions.appendChild(btnDel);

      row.appendChild(cover);
      row.appendChild(info);
      row.appendChild(actions);

      row.addEventListener("click",()=>{
        if(openPl===name){ openPl=null; }
        else { openPl=name; }
        renderPlaylists();
      });

      block.appendChild(row);

      // dropdown
      const dd = document.createElement("div");
      dd.className = "pl-dropdown"+(isOpen?" open":"");

      if(isOpen){
        if(!tracks.length){
          dd.innerHTML = `<div class="empty">Плейлист пустой</div>`;
        } else {
          tracks.forEach((t,i)=>{
            const trk = document.createElement("div");
            trk.className = "trk";
            trk.innerHTML = `
              <div class="trk-num">${i+1}</div>
              <div class="trk-info">
                <div class="trk-title">${t.title||"Track"}</div>
                <div class="trk-artist">${t.artist||""}</div>
              </div>
              <div class="trk-dur">${fmt(t.duration)}</div>
            `;
            trk.addEventListener("click",(e)=>{
              e.stopPropagation();
              playTrack(t);
            });
            dd.appendChild(trk);
          });
        }
      }

      block.appendChild(dd);
      list.appendChild(block);
    });
  }

  function playTrack(t){
    if(t.audio_url){
      const a = new Audio(t.audio_url);
      a.play().catch(()=>{});
    }
  }

  qs("header").addEventListener("click",()=>{
    if(openPl){ openPl=null; renderPlaylists(); }
  });

  // ───── create playlist step 1 ─────

  function showCreateModal(){
    openPl = null;
    renderPlaylists();
    qs("plErr").textContent = "";
    qs("plName").value = "";
    createCoverFile = null;
    qs("coverImg").style.display = "none";
    qs("coverPlus").style.display = "block";
    qs("coverImg").src = "";
    qs("mBack").classList.add("show");
    qs("mCreate").classList.add("show");
    setTimeout(()=>qs("plName").focus(),30);
  }

  function hideCreateModal(){
    qs("mBack").classList.remove("show");
    qs("mCreate").classList.remove("show");
  }

  qs("btnCreate").addEventListener("click",showCreateModal);
  qs("mBack").addEventListener("click",hideCreateModal);
  qs("plCancel").addEventListener("click",hideCreateModal);

  qs("coverPick").addEventListener("click",()=>{ qs("coverFile").click(); });

  qs("coverFile").addEventListener("change",(e)=>{
    const f = e.target.files&&e.target.files[0];
    if(!f) return;
    createCoverFile = f;
    qs("coverImg").src = URL.createObjectURL(f);
    qs("coverImg").style.display = "block";
    qs("coverPlus").style.display = "none";
  });

  qs("plNext").addEventListener("click",async()=>{
    const name = qs("plName").value.trim();
    if(!name){ qs("plErr").textContent = "Название обязательно"; return; }
    try{
      await apiPost("/api/playlist",{name});
      hideCreateModal();
      await load();
    }catch(e){
      qs("plErr").textContent = "Плейлист уже существует";
    }
  });

  load();
</script>
</body>
</html>
