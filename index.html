<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Music Player</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{
      --bg:#0f0f10;
      --card:#171718;
      --text:#f2f2f2;
      --muted:#9a9a9a;
      --line:#2a2a2c;
      --btn:#1e1e20;
      --danger:#ff5a5a;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background:var(--bg);
      color:var(--text);
      height:100vh;
      overflow:hidden;
    }

    .header{
      height:56px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:700;
      letter-spacing:1px;
      text-transform:uppercase;
      border-bottom:1px solid var(--line);
      user-select:none;
      cursor:pointer;
    }

    .wrap{
      height:calc(100vh - 56px);
      overflow:auto;
      padding:14px 14px 90px;
    }

    .pl{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:14px;
      padding:10px;
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:10px;
      user-select:none;
      cursor:pointer;
    }
    .pl-cover{
      width:54px;
      height:54px;
      border-radius:12px;
      background:#222;
      overflow:hidden;
      flex:0 0 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--muted);
      font-size:22px;
    }
    .pl-cover img{width:100%;height:100%;object-fit:cover}
    .pl-info{min-width:0;flex:1}
    .pl-name{
      font-weight:650;
      font-size:16px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .pl-count{
      margin-top:3px;
      color:var(--muted);
      font-size:12px;
    }

    .side-actions{
      position:fixed;
      right:14px;
      top:86px;
      display:none;
      flex-direction:column;
      gap:10px;
      z-index:40;
    }
    .side-actions.show{display:flex}
    .fab{
      width:44px;
      height:44px;
      border-radius:14px;
      background:var(--btn);
      border:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--text);
      font-size:18px;
      user-select:none;
      cursor:pointer;
    }

    .sheet-backdrop{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.35);
      opacity:0;
      pointer-events:none;
      transition:opacity .18s;
      z-index:20;
    }
    .sheet-backdrop.show{opacity:1;pointer-events:auto}
    .sheet{
      position:fixed;
      left:0;
      right:0;
      bottom:-75vh;
      height:72vh;
      background:var(--card);
      border-top:1px solid var(--line);
      border-top-left-radius:18px;
      border-top-right-radius:18px;
      transition:bottom .22s ease;
      z-index:30;
      display:flex;
      flex-direction:column;
    }
    .sheet.show{bottom:0}
    .sheet-handle{
      width:44px;
      height:5px;
      border-radius:99px;
      background:#2a2a2c;
      margin:10px auto 6px;
    }
    .sheet-title{
      padding:6px 16px 10px;
      font-weight:700;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      border-bottom:1px solid var(--line);
    }
    .sheet-title .name{
      min-width:0;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .tracks{
      overflow:auto;
      padding:10px 10px 18px;
    }
    .trk{
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px;
      border-radius:12px;
      cursor:pointer;
    }
    .trk:active{background:#202022}
    .trk-num{width:24px;color:var(--muted);text-align:center;font-size:13px}
    .trk-info{min-width:0;flex:1}
    .trk-title{
      font-size:14px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .trk-artist{
      font-size:12px;
      color:var(--muted);
      margin-top:2px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .trk-dur{color:var(--muted);font-size:12px;flex:0 0 auto}

    .empty{
      color:var(--muted);
      text-align:center;
      padding:28px 10px;
      line-height:1.6;
    }

    .create{
      position:fixed;
      left:14px;
      right:14px;
      bottom:14px;
      height:54px;
      border-radius:16px;
      background:var(--btn);
      border:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:650;
      font-size:15px;
      user-select:none;
      cursor:pointer;
      z-index:10;
    }

    /* ───────── modal ───────── */
    .modal-backdrop{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.55);
      opacity:0;
      pointer-events:none;
      transition:opacity .16s;
      z-index:80;
    }
    .modal-backdrop.show{opacity:1;pointer-events:auto}
    .modal{
      position:fixed;
      left:14px;
      right:14px;
      top:50%;
      transform:translateY(30px);
      opacity:0;
      pointer-events:none;
      transition:opacity .16s, transform .16s;
      z-index:90;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      padding:14px;
    }
    .modal.show{
      transform:translateY(-50%);
      opacity:1;
      pointer-events:auto;
    }
    .modal-title{
      font-weight:750;
      margin-bottom:12px;
      text-align:center;
    }

    .cover-pick{
      width:110px;
      height:110px;
      border-radius:18px;
      border:2px dashed #999999;
      margin:0 auto 14px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#999999;
      user-select:none;
      cursor:pointer;
      overflow:hidden;
      position:relative;
    }
    .cover-pick img{width:100%;height:100%;object-fit:cover}
    .cover-plus{
      font-size:34px;
      line-height:1;
    }

    .field{
      display:flex;
      flex-direction:column;
      gap:6px;
      margin-bottom:14px;
    }
    .label{font-size:12px;color:var(--muted)}
    input[type="text"]{
      height:46px;
      border-radius:14px;
      border:1px solid var(--line);
      background:#121213;
      color:var(--text);
      padding:0 12px;
      outline:none;
      font-size:15px;
    }

    .row-btns{
      display:flex;
      gap:10px;
    }
    .btn{
      flex:1;
      height:46px;
      border-radius:14px;
      border:1px solid var(--line);
      background:var(--btn);
      color:var(--text);
      font-weight:650;
      cursor:pointer;
      user-select:none;
    }
    .btn:active{opacity:.9}
    .btn.primary{background:#2a2a2d}
    .btn.danger{border-color:#3a2a2a;color:var(--danger)}
    .err{
      color:var(--danger);
      font-size:12px;
      text-align:center;
      min-height:16px;
      margin-top:2px;
    }
  </style>
</head>
<body>

  <div class="header" id="header">ПЛЕЙЛИСТЫ</div>
  <div class="wrap" id="list"></div>
  <div class="create" id="btnCreate">+ Создать плейлист</div>

  <div class="side-actions" id="sideActions">
    <div class="fab" id="btnEdit">✎</div>
    <div class="fab" id="btnDelete">🗑</div>
  </div>

  <div class="sheet-backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">
      <div class="name" id="sheetName">—</div>
      <div style="color:var(--muted);font-size:12px" id="sheetCount"></div>
    </div>
    <div class="tracks" id="tracks"></div>
  </div>

  <!-- Modal: Create playlist step 1 -->
  <div class="modal-backdrop" id="mBack"></div>
  <div class="modal" id="mCreate">
    <div class="modal-title">Создать плейлист</div>

    <div class="cover-pick" id="coverPick">
      <div class="cover-plus" id="coverPlus">+</div>
      <img id="coverImg" style="display:none" />
    </div>
    <input id="coverFile" type="file" accept="image/*" style="display:none" />

    <div class="field">
      <div class="label">Название (обязательно)</div>
      <input type="text" id="plName" placeholder="Название плейлиста" />
      <div class="err" id="plErr"></div>
    </div>

    <div class="row-btns">
      <button class="btn danger" id="plCancel">Отмена</button>
      <button class="btn primary" id="plNext">Далее</button>
    </div>
  </div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const API_BASE = "https://music-player-server-jjkm.onrender.com";

  let playlists = {};
  let openPl = null;
  let panelShown = false;

  // create step 1 state
  let createCoverFile = null;

  function qs(id){ return document.getElementById(id); }

  function fmt(sec){
    sec = Math.floor(sec || 0);
    return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;
  }

  async function apiGet(path){
    const sep = path.includes("?") ? "&" : "?";
    const r = await fetch(API_BASE + path + sep + "init_data=" + encodeURIComponent(tg.initData));
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "api error");
    return j;
  }

  async function apiPost(path, body){
    const r = await fetch(API_BASE + path + "?init_data=" + encodeURIComponent(tg.initData), {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(body || {})
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "api error");
    return j;
  }

  async function apiDelete(path, body){
    const r = await fetch(API_BASE + path + "?init_data=" + encodeURIComponent(tg.initData), {
      method: "DELETE",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(body || {})
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "api error");
    return j;
  }

  async function load(){
    qs("list").innerHTML = `<div class="empty">Загрузка…</div>`;
    try{
      playlists = await apiGet("/api/playlists");
      renderPlaylists();
    }catch(e){
      qs("list").innerHTML = `<div class="empty">Ошибка загрузки</div>`;
    }
  }

  function renderPlaylists(){
    const list = qs("list");
    const names = Object.keys(playlists);

    if (!names.length){
      list.innerHTML = `<div class="empty">Плейлисты не найдены</div>`;
      hidePanel(); hideSide();
      return;
    }

    list.innerHTML = "";
    names.forEach(name=>{
      const pl = playlists[name];
      const count = (pl.tracks||[]).length;

      const row = document.createElement("div");
      row.className = "pl";
      row.dataset.name = name;

      const cover = document.createElement("div");
      cover.className = "pl-cover";
      if (pl.cover_url){
        const img = document.createElement("img");
        img.src = pl.cover_url;
        cover.appendChild(img);
      } else {
        cover.textContent = "♪";
      }

      const info = document.createElement("div");
      info.className = "pl-info";
      info.innerHTML = `<div class="pl-name">${name}</div><div class="pl-count">${count} тр.</div>`;

      row.appendChild(cover);
      row.appendChild(info);
      row.addEventListener("click", ()=>togglePlaylist(name));
      list.appendChild(row);
    });
  }

  function togglePlaylist(name){
    if (panelShown && openPl === name){
      hidePanel(); hideSide(); return;
    }
    openPl = name;
    showPanel(name);
    showSide();
  }

  function showSide(){ qs("sideActions").classList.add("show"); }
  function hideSide(){ qs("sideActions").classList.remove("show"); }

  function showPanel(name){
    const tracks = (playlists[name]&&playlists[name].tracks)||[];
    qs("sheetName").textContent = name;
    qs("sheetCount").textContent = tracks.length ? `${tracks.length} тр.` : "";

    const box = qs("tracks");
    if (!tracks.length){
      box.innerHTML = `<div class="empty">Плейлист пустой</div>`;
    } else {
      box.innerHTML = "";
      tracks.forEach((t,i)=>{
        const div = document.createElement("div");
        div.className = "trk";
        div.innerHTML = `
          <div class="trk-num">${i+1}</div>
          <div class="trk-info">
            <div class="trk-title">${t.title||"Track"}</div>
            <div class="trk-artist">${t.artist||""}</div>
          </div>
          <div class="trk-dur">${fmt(t.duration)}</div>
        `;
        div.addEventListener("click", ()=>playTrack(t));
        box.appendChild(div);
      });
    }

    qs("backdrop").classList.add("show");
    qs("sheet").classList.add("show");
    panelShown = true;
  }

  function hidePanel(){
    qs("backdrop").classList.remove("show");
    qs("sheet").classList.remove("show");
    panelShown = false;
    openPl = null;
  }

  function playTrack(t){
    if (t.audio_url){
      const a = new Audio(t.audio_url);
      a.play().catch(()=>{});
    }
  }

  qs("header").addEventListener("click", ()=>{
    if (panelShown){ hidePanel(); hideSide(); }
  });

  qs("backdrop").addEventListener("click", ()=>{
    hidePanel(); hideSide();
  });

  qs("btnDelete").addEventListener("click", async ()=>{
    if (!openPl) return;
    if (confirm(`Удалить плейлист «${openPl}»?`)){
      await apiDelete(`/api/playlist/${encodeURIComponent(openPl)}`);
      hidePanel(); hideSide();
      await load();
    }
  });

  qs("btnEdit").addEventListener("click", ()=>{
    if (!openPl) return;
    alert("Редактирование — следующий шаг");
  });

  // ───────── Create playlist step 1 ─────────

  function showCreateModal(){
    // закрыть панели
    hidePanel(); hideSide();

    qs("plErr").textContent = "";
    qs("plName").value = "";
    createCoverFile = null;

    qs("coverImg").style.display = "none";
    qs("coverPlus").style.display = "block";
    qs("coverImg").src = "";

    qs("mBack").classList.add("show");
    qs("mCreate").classList.add("show");
    setTimeout(()=>qs("plName").focus(), 30);
  }

  function hideCreateModal(){
    qs("mBack").classList.remove("show");
    qs("mCreate").classList.remove("show");
  }

  qs("btnCreate").addEventListener("click", showCreateModal);
  qs("mBack").addEventListener("click", hideCreateModal);
  qs("plCancel").addEventListener("click", hideCreateModal);

  qs("coverPick").addEventListener("click", ()=>{
    qs("coverFile").click();
  });

  qs("coverFile").addEventListener("change", (e)=>{
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    createCoverFile = f;
    const url = URL.createObjectURL(f);
    qs("coverImg").src = url;
    qs("coverImg").style.display = "block";
    qs("coverPlus").style.display = "none";
  });

  qs("plNext").addEventListener("click", async ()=>{
    const name = qs("plName").value.trim();
    if (!name){
      qs("plErr").textContent = "Название обязательно";
      return;
    }

    // пока: создаём плейлист без обложки (обложку подключим следующим шагом через upload endpoint)
    try{
      await apiPost("/api/playlist", {name});
      hideCreateModal();
      await load();
      alert("Далее: добавление треков (шаг 2)");
    }catch(e){
      qs("plErr").textContent = "Не удалось создать (возможно уже существует)";
    }
  });

  load();
</script>
</body>
</html>
