<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Music Player</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{
      --bg:#0f0f10;
      --card:#171718;
      --text:#f2f2f2;
      --muted:#9a9a9a;
      --line:#2a2a2c;
      --btn:#1e1e20;
      --danger:#ff5a5a;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      background:var(--bg);
      color:var(--text);
      height:100vh;
      overflow:hidden;
    }

    .header{
      height:56px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:700;
      letter-spacing:1px;
      text-transform:uppercase;
      border-bottom:1px solid var(--line);
      user-select:none;
      cursor:pointer;
    }

    .wrap{
      height:calc(100vh - 56px);
      overflow:auto;
      padding:14px 14px 90px;
    }

    /* playlist row */
    .pl{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:14px;
      padding:10px;
      display:flex;
      align-items:center;
      gap:10px;
      margin-bottom:10px;
      user-select:none;
      cursor:pointer;
    }
    .pl.active{border-color:#444}
    .pl-cover{
      width:50px;
      height:50px;
      border-radius:12px;
      background:#222;
      overflow:hidden;
      flex:0 0 50px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--muted);
      font-size:20px;
    }
    .pl-cover img{width:100%;height:100%;object-fit:cover}
    .pl-info{min-width:0;flex:1}
    .pl-name{
      font-weight:650;
      font-size:15px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .pl-count{
      margin-top:2px;
      color:var(--muted);
      font-size:12px;
    }

    /* inline action buttons */
    .pl-actions{
      display:none;
      gap:6px;
      flex:0 0 auto;
      align-items:center;
    }
    .pl.active .pl-actions{display:flex}
    .pl-btn{
      width:38px;
      height:38px;
      border-radius:10px;
      background:var(--btn);
      border:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:16px;
      cursor:pointer;
      user-select:none;
    }
    .pl-btn:active{opacity:.8}

    /* floating window overlay */
    .overlay-bg{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.5);
      opacity:0;
      pointer-events:none;
      transition:opacity .16s;
      z-index:50;
    }
    .overlay-bg.show{opacity:1;pointer-events:auto}

    .float-win{
      position:fixed;
      left:16px;
      right:16px;
      top:50%;
      transform:translateY(-50%) scale(.96);
      max-height:70vh;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      display:flex;
      flex-direction:column;
      opacity:0;
      pointer-events:none;
      transition:opacity .16s,transform .16s;
      z-index:60;
      overflow:hidden;
    }
    .float-win.show{
      opacity:1;
      pointer-events:auto;
      transform:translateY(-50%) scale(1);
    }

    .fw-header{
      padding:14px 16px;
      font-weight:700;
      font-size:16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      border-bottom:1px solid var(--line);
      flex:0 0 auto;
    }
    .fw-close{
      width:32px;
      height:32px;
      border-radius:50%;
      background:var(--btn);
      border:none;
      color:var(--text);
      font-size:16px;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
    }
    .fw-body{
      overflow:auto;
      padding:8px 8px 14px;
      flex:1;
    }

    .trk{
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px;
      border-radius:12px;
      cursor:pointer;
    }
    .trk:active{background:#202022}
    .trk-num{width:24px;color:var(--muted);text-align:center;font-size:13px}
    .trk-info{min-width:0;flex:1}
    .trk-title{
      font-size:14px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .trk-artist{
      font-size:12px;
      color:var(--muted);
      margin-top:2px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .trk-dur{color:var(--muted);font-size:12px;flex:0 0 auto}

    .empty{
      color:var(--muted);
      text-align:center;
      padding:28px 10px;
      line-height:1.6;
    }

    .create{
      position:fixed;
      left:14px;
      right:14px;
      bottom:14px;
      height:54px;
      border-radius:16px;
      background:var(--btn);
      border:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:650;
      font-size:15px;
      user-select:none;
      cursor:pointer;
      z-index:10;
    }

    /* modal create */
    .modal-backdrop{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.55);
      opacity:0;
      pointer-events:none;
      transition:opacity .16s;
      z-index:80;
    }
    .modal-backdrop.show{opacity:1;pointer-events:auto}
    .modal{
      position:fixed;
      left:14px;
      right:14px;
      top:50%;
      transform:translateY(30px);
      opacity:0;
      pointer-events:none;
      transition:opacity .16s,transform .16s;
      z-index:90;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      padding:14px;
    }
    .modal.show{
      transform:translateY(-50%);
      opacity:1;
      pointer-events:auto;
    }
    .modal-title{
      font-weight:750;
      margin-bottom:12px;
      text-align:center;
    }
    .cover-pick{
      width:110px;
      height:110px;
      border-radius:18px;
      border:2px dashed #999;
      margin:0 auto 14px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#999;
      user-select:none;
      cursor:pointer;
      overflow:hidden;
    }
    .cover-pick img{width:100%;height:100%;object-fit:cover}
    .cover-plus{font-size:34px;line-height:1}
    .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
    .label{font-size:12px;color:var(--muted)}
    input[type="text"]{
      height:46px;
      border-radius:14px;
      border:1px solid var(--line);
      background:#121213;
      color:var(--text);
      padding:0 12px;
      outline:none;
      font-size:15px;
    }
    .row-btns{display:flex;gap:10px}
    .btn{
      flex:1;
      height:46px;
      border-radius:14px;
      border:1px solid var(--line);
      background:var(--btn);
      color:var(--text);
      font-weight:650;
      font-size:14px;
      cursor:pointer;
    }
    .btn:active{opacity:.9}
    .btn.primary{background:#2a2a2d}
    .btn.danger{border-color:#3a2a2a;color:var(--danger)}
    .err{color:var(--danger);font-size:12px;text-align:center;min-height:16px;margin-top:2px}
  </style>
</head>
<body>

  <div class="header" id="header">ПЛЕЙЛИСТЫ</div>
  <div class="wrap" id="list"></div>
  <div class="create" id="btnCreate">+ Создать плейлист</div>

  <!-- Floating window: tracks -->
  <div class="overlay-bg" id="overlay"></div>
  <div class="float-win" id="floatWin">
    <div class="fw-header">
      <span id="fwName">—</span>
      <button class="fw-close" id="fwClose">✕</button>
    </div>
    <div class="fw-body" id="fwBody"></div>
  </div>

  <!-- Modal: create playlist step 1 -->
  <div class="modal-backdrop" id="mBack"></div>
  <div class="modal" id="mCreate">
    <div class="modal-title">Создать плейлист</div>
    <div class="cover-pick" id="coverPick">
      <div class="cover-plus" id="coverPlus">+</div>
      <img id="coverImg" style="display:none" />
    </div>
    <input id="coverFile" type="file" accept="image/*" style="display:none" />
    <div class="field">
      <div class="label">Название (обязательно)</div>
      <input type="text" id="plName" placeholder="Название плейлиста" />
      <div class="err" id="plErr"></div>
    </div>
    <div class="row-btns">
      <button class="btn danger" id="plCancel">Отмена</button>
      <button class="btn primary" id="plNext">Далее</button>
    </div>
  </div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const API_BASE = "https://music-player-server-jjkm.onrender.com";

  let playlists = {};
  let openPl = null;
  let createCoverFile = null;

  function qs(id){ return document.getElementById(id); }

  function fmt(sec){
    sec = Math.floor(sec||0);
    return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;
  }

  async function apiGet(path){
    const sep = path.includes("?") ? "&" : "?";
    const r = await fetch(API_BASE+path+sep+"init_data="+encodeURIComponent(tg.initData));
    const j = await r.json();
    if(!r.ok) throw new Error(j.error||"api");
    return j;
  }
  async function apiPost(path,body){
    const r = await fetch(API_BASE+path+"?init_data="+encodeURIComponent(tg.initData),{
      method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})
    });
    const j = await r.json();
    if(!r.ok) throw new Error(j.error||"api");
    return j;
  }
  async function apiDelete(path,body){
    const r = await fetch(API_BASE+path+"?init_data="+encodeURIComponent(tg.initData),{
      method:"DELETE",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})
    });
    const j = await r.json();
    if(!r.ok) throw new Error(j.error||"api");
    return j;
  }

  async function load(){
    qs("list").innerHTML = `<div class="empty">Загрузка…</div>`;
    try{
      playlists = await apiGet("/api/playlists");
      renderPlaylists();
    }catch(e){
      qs("list").innerHTML = `<div class="empty">Ошибка загрузки</div>`;
    }
  }

  function renderPlaylists(){
    const list = qs("list");
    const names = Object.keys(playlists);

    if(!names.length){
      list.innerHTML = `<div class="empty">Плейлисты не найдены</div>`;
      return;
    }

    list.innerHTML = "";
    names.forEach(name=>{
      const pl = playlists[name];
      const count = (pl.tracks||[]).length;

      const row = document.createElement("div");
      row.className = "pl" + (openPl===name ? " active" : "");
      row.dataset.name = name;

      // cover
      const cover = document.createElement("div");
      cover.className = "pl-cover";
      if(pl.cover_url){
        const img = document.createElement("img");
        img.src = pl.cover_url;
        cover.appendChild(img);
      } else {
        cover.textContent = "♪";
      }

      // info
      const info = document.createElement("div");
      info.className = "pl-info";
      info.innerHTML = `<div class="pl-name">${name}</div><div class="pl-count">${count} тр.</div>`;

      // inline action buttons
      const actions = document.createElement("div");
      actions.className = "pl-actions";

      const btnEdit = document.createElement("div");
      btnEdit.className = "pl-btn";
      btnEdit.textContent = "✏️";
      btnEdit.addEventListener("click", (e)=>{
        e.stopPropagation();
        alert("Редактирование — следующий шаг");
      });

      const btnDel = document.createElement("div");
      btnDel.className = "pl-btn";
      btnDel.textContent = "🗑️";
      btnDel.addEventListener("click", async (e)=>{
        e.stopPropagation();
        if(confirm(`Удалить плейлист «${name}»?`)){
          await apiDelete(`/api/playlist/${encodeURIComponent(name)}`);
          openPl = null;
          closeFloat();
          await load();
        }
      });

      actions.appendChild(btnEdit);
      actions.appendChild(btnDel);

      row.appendChild(cover);
      row.appendChild(info);
      row.appendChild(actions);

      row.addEventListener("click", ()=>togglePlaylist(name));
      list.appendChild(row);
    });
  }

  function togglePlaylist(name){
    if(openPl === name){
      openPl = null;
      closeFloat();
      renderPlaylists();
      return;
    }
    openPl = name;
    renderPlaylists();
    showFloat(name);
  }

  // ───── floating window ─────

  function showFloat(name){
    const tracks = (playlists[name]&&playlists[name].tracks)||[];
    qs("fwName").textContent = name;

    const box = qs("fwBody");
    if(!tracks.length){
      box.innerHTML = `<div class="empty">Плейлист пустой</div>`;
    } else {
      box.innerHTML = "";
      tracks.forEach((t,i)=>{
        const div = document.createElement("div");
        div.className = "trk";
        div.innerHTML = `
          <div class="trk-num">${i+1}</div>
          <div class="trk-info">
            <div class="trk-title">${t.title||"Track"}</div>
            <div class="trk-artist">${t.artist||""}</div>
          </div>
          <div class="trk-dur">${fmt(t.duration)}</div>
        `;
        div.addEventListener("click",()=>playTrack(t));
        box.appendChild(div);
      });
    }

    qs("overlay").classList.add("show");
    qs("floatWin").classList.add("show");
  }

  function closeFloat(){
    qs("overlay").classList.remove("show");
    qs("floatWin").classList.remove("show");
  }

  function playTrack(t){
    if(t.audio_url){
      const a = new Audio(t.audio_url);
      a.play().catch(()=>{});
    }
  }

  qs("header").addEventListener("click",()=>{
    if(openPl){
      openPl = null;
      closeFloat();
      renderPlaylists();
    }
  });

  qs("overlay").addEventListener("click",()=>{
    openPl = null;
    closeFloat();
    renderPlaylists();
  });

  qs("fwClose").addEventListener("click",()=>{
    openPl = null;
    closeFloat();
    renderPlaylists();
  });

  // ───── create playlist step 1 ─────

  function showCreateModal(){
    openPl = null;
    closeFloat();
    renderPlaylists();

    qs("plErr").textContent = "";
    qs("plName").value = "";
    createCoverFile = null;
    qs("coverImg").style.display = "none";
    qs("coverPlus").style.display = "block";
    qs("coverImg").src = "";

    qs("mBack").classList.add("show");
    qs("mCreate").classList.add("show");
    setTimeout(()=>qs("plName").focus(),30);
  }

  function hideCreateModal(){
    qs("mBack").classList.remove("show");
    qs("mCreate").classList.remove("show");
  }

  qs("btnCreate").addEventListener("click", showCreateModal);
  qs("mBack").addEventListener("click", hideCreateModal);
  qs("plCancel").addEventListener("click", hideCreateModal);

  qs("coverPick").addEventListener("click",()=>{
    qs("coverFile").click();
  });

  qs("coverFile").addEventListener("change",(e)=>{
    const f = e.target.files&&e.target.files[0];
    if(!f) return;
    createCoverFile = f;
    const url = URL.createObjectURL(f);
    qs("coverImg").src = url;
    qs("coverImg").style.display = "block";
    qs("coverPlus").style.display = "none";
  });

  qs("plNext").addEventListener("click", async ()=>{
    const name = qs("plName").value.trim();
    if(!name){
      qs("plErr").textContent = "Название обязательно";
      return;
    }
    try{
      await apiPost("/api/playlist",{name});
      hideCreateModal();
      await load();
      // TODO: step 2 — добавление треков
    }catch(e){
      qs("plErr").textContent = "Плейлист уже существует";
    }
  });

  load();
</script>
</body>
</html>
