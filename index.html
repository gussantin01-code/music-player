<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Music Player</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{
      --bg:#0f0f10;
      --card:#171718;
      --text:#f2f2f2;
      --muted:#9a9a9a;
      --line:#2a2a2c;
      --accent:#7b61ff;      /* фиолетовый (кружки-нажатия у тебя в макете) */
      --btn:#1e1e20;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background:var(--bg);
      color:var(--text);
      height:100vh;
      overflow:hidden;
    }

    /* header */
    .header{
      height:56px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:700;
      letter-spacing:1px;
      text-transform:uppercase;
      border-bottom:1px solid var(--line);
      position:relative;
      user-select:none;
    }
    .header:active{opacity:.92}
    .wrap{
      height:calc(100vh - 56px);
      overflow:auto;
      padding:14px 14px 90px;
    }

    /* playlist row */
    .pl{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:14px;
      padding:10px;
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:10px;
      position:relative;
      transition:transform .08s;
      user-select:none;
    }
    .pl:active{transform:scale(.995)}
    .pl-cover{
      width:54px;
      height:54px;
      border-radius:12px;
      background:#222;
      overflow:hidden;
      flex:0 0 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--muted);
      font-size:22px;
    }
    .pl-cover img{width:100%;height:100%;object-fit:cover}
    .pl-info{min-width:0; flex:1}
    .pl-name{
      font-weight:650;
      font-size:16px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .pl-count{
      margin-top:3px;
      color:var(--muted);
      font-size:12px;
    }

    /* edit/delete floating buttons (right side) */
    .side-actions{
      position:fixed;
      right:14px;
      top:86px;
      display:none;
      flex-direction:column;
      gap:10px;
      z-index:40;
    }
    .side-actions.show{display:flex}
    .fab{
      width:44px;
      height:44px;
      border-radius:14px;
      background:var(--btn);
      border:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--text);
      font-size:18px;
      user-select:none;
    }
    .fab:active{opacity:.9}

    /* bottom sheet */
    .sheet-backdrop{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.35);
      opacity:0;
      pointer-events:none;
      transition:opacity .18s;
      z-index:20;
    }
    .sheet-backdrop.show{opacity:1; pointer-events:auto}
    .sheet{
      position:fixed;
      left:0;
      right:0;
      bottom:-75vh;
      height:72vh;
      background:var(--card);
      border-top:1px solid var(--line);
      border-top-left-radius:18px;
      border-top-right-radius:18px;
      transition:bottom .22s ease;
      z-index:30;
      display:flex;
      flex-direction:column;
    }
    .sheet.show{bottom:0}
    .sheet-handle{
      width:44px;height:5px;border-radius:99px;
      background:#333;
      margin:10px auto 6px;
    }
    .sheet-title{
      padding:6px 16px 10px;
      font-weight:700;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      border-bottom:1px solid var(--line);
    }
    .sheet-title .name{
      min-width:0;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .tracks{
      overflow:auto;
      padding:10px 10px 18px;
    }
    .trk{
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 10px;
      border-radius:12px;
      border:1px solid transparent;
      user-select:none;
    }
    .trk:active{background:#202022}
    .trk-num{width:24px; color:var(--muted); text-align:center}
    .trk-info{min-width:0;flex:1}
    .trk-title{
      font-size:14px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .trk-artist{
      font-size:12px;
      color:var(--muted);
      margin-top:2px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .trk-dur{color:var(--muted); font-size:12px; flex:0 0 auto}

    /* empty */
    .empty{
      color:var(--muted);
      text-align:center;
      padding:28px 10px;
      line-height:1.4;
    }

    /* create button bottom */
    .create{
      position:fixed;
      left:14px;
      right:14px;
      bottom:14px;
      height:54px;
      border-radius:16px;
      background:#1f1f22;
      border:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:650;
      user-select:none;
      z-index:10;
    }
    .create:active{opacity:.9}
  </style>
</head>
<body>
  <div class="header" id="header">ПЛЕЙЛИСТЫ</div>

  <div class="wrap" id="list"></div>

  <div class="create" id="btnCreate">Создать плейлист</div>

  <div class="side-actions" id="sideActions">
    <div class="fab" id="btnEdit" title="Редактировать">✎</div>
    <div class="fab" id="btnDelete" title="Удалить">🗑</div>
  </div>

  <div class="sheet-backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">
      <div class="name" id="sheetName">—</div>
      <div style="color:var(--muted);font-size:12px" id="sheetCount"></div>
    </div>
    <div class="tracks" id="tracks"></div>
  </div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const API_BASE = "https://music-player-server-jjkm.onrender.com";

  let playlists = {};
  let openPl = null;     // имя открытого плейлиста (панель)
  let panelShown = false;

  function qs(id){ return document.getElementById(id); }

  function fmt(sec){
    sec = Math.floor(sec || 0);
    const m = Math.floor(sec/60);
    const s = sec%60;
    return `${m}:${String(s).padStart(2,'0')}`;
  }

  async function apiGet(path){
    const url = API_BASE + path + (path.includes("?") ? "&" : "?") + "init_data=" + encodeURIComponent(tg.initData);
    const r = await fetch(url);
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "api");
    return j;
  }

  async function load(){
    const list = qs("list");
    list.innerHTML = `<div class="empty">Загрузка…</div>`;
    try{
      playlists = await apiGet("/api/playlists");
      renderPlaylists();
    }catch(e){
      list.innerHTML = `<div class="empty">Ошибка загрузки</div>`;
    }
  }

  function renderPlaylists(){
    const list = qs("list");
    const names = Object.keys(playlists);

    if (!names.length){
      list.innerHTML = `<div class="empty">Плейлисты не найдены</div>`;
      hidePanel();
      hideSide();
      return;
    }

    list.innerHTML = "";
    names.forEach(name=>{
      const pl = playlists[name];
      const count = (pl.tracks || []).length;

      const row = document.createElement("div");
      row.className = "pl";
      row.dataset.name = name;

      const cover = document.createElement("div");
      cover.className = "pl-cover";
      if (pl.cover_url){
        const img = document.createElement("img");
        img.src = pl.cover_url;
        cover.appendChild(img);
      } else {
        cover.textContent = "♪";
      }

      const info = document.createElement("div");
      info.className = "pl-info";
      info.innerHTML = `<div class="pl-name">${name}</div><div class="pl-count">${count} тр.</div>`;

      row.appendChild(cover);
      row.appendChild(info);

      row.addEventListener("click", ()=>togglePlaylist(name));
      list.appendChild(row);
    });
  }

  function togglePlaylist(name){
    // правило ТЗ: повторное нажатие на тот же плейлист — закрыть панель и кнопки
    if (panelShown && openPl === name){
      hidePanel();
      hideSide();
      return;
    }
    openPl = name;
    showPanel(name);
    showSide();
  }

  function showSide(){
    qs("sideActions").classList.add("show");
  }
  function hideSide(){
    qs("sideActions").classList.remove("show");
  }

  function showPanel(name){
    const pl = playlists[name];
    const tracks = (pl && pl.tracks) ? pl.tracks : [];

    qs("sheetName").textContent = name;
    qs("sheetCount").textContent = tracks.length ? `${tracks.length} тр.` : "";

    const box = qs("tracks");
    if (!tracks.length){
      box.innerHTML = `<div class="empty">Плейлист пустой</div>`;
    } else {
      box.innerHTML = "";
      tracks.forEach((t, i)=>{
        const div = document.createElement("div");
        div.className = "trk";
        div.innerHTML = `
          <div class="trk-num">${i+1}</div>
          <div class="trk-info">
            <div class="trk-title">${(t.title || "Track")}</div>
            <div class="trk-artist">${(t.artist || "")}</div>
          </div>
          <div class="trk-dur">${fmt(t.duration)}</div>
        `;
        div.addEventListener("click", ()=>playTrack(t));
        box.appendChild(div);
      });
    }

    qs("backdrop").classList.add("show");
    qs("sheet").classList.add("show");
    panelShown = true;
  }

  function hidePanel(){
    qs("backdrop").classList.remove("show");
    qs("sheet").classList.remove("show");
    panelShown = false;
    openPl = null;
  }

  function playTrack(t){
    // пока просто отправляем аудио в Telegram (как fallback)
    // дальше сделаем полноценный плеер-экран
    if (t.audio_url){
      const a = new Audio(t.audio_url);
      a.play().catch(()=>{});
    }
  }

  // закрытие по нажатию на заголовок "ПЛЕЙЛИСТЫ" (ТЗ)
  qs("header").addEventListener("click", ()=>{
    if (panelShown){
      hidePanel();
      hideSide();
    }
  });

  // закрытие по клику на фон
  qs("backdrop").addEventListener("click", ()=>{
    hidePanel();
    hideSide();
  });

  // заглушки кнопок (следующий шаг — сделаем редактирование/удаление/создание)
  qs("btnEdit").addEventListener("click", ()=>{
    if (!openPl) return;
    alert("Редактирование: " + openPl);
  });
  qs("btnDelete").addEventListener("click", ()=>{
    if (!openPl) return;
    alert("Удаление: " + openPl);
  });
  qs("btnCreate").addEventListener("click", ()=>{
    alert("Создание плейлиста (шаг 1) — следующим шагом");
  });

  load();
</script>
</body>
</html>
