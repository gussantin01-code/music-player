<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Music Player</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{
      --bg:#0f0f10;
      --card:#171718;
      --text:#f2f2f2;
      --muted:#9a9a9a;
      --line:#2a2a2c;
      --btn:#1e1e20;
      --danger:#ff5a5a;
      --inner:#131314;
      --active-tab:#f2f2f2;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      background:var(--bg);color:var(--text);
      height:100vh;overflow:hidden;
    }

    .screen{display:none;flex-direction:column;height:100vh}
    .screen.active{display:flex}

    /* ── tabs header ── */
    .tabs{
      height:56px;flex:0 0 56px;
      display:flex;align-items:center;
      border-bottom:1px solid var(--line);
      position:relative;user-select:none;
    }
    .tab{
      flex:1;height:100%;
      display:flex;align-items:center;justify-content:center;
      font-weight:700;font-size:13px;letter-spacing:1px;
      text-transform:uppercase;color:var(--muted);
      cursor:pointer;position:relative;
    }
    .tab.active{color:var(--active-tab)}
    .tab.active::after{
      content:'';position:absolute;bottom:0;left:20%;right:20%;
      height:2px;background:var(--text);border-radius:1px;
    }

    /* ── simple header (s2/s3) ── */
    .header{
      height:56px;flex:0 0 56px;
      display:flex;align-items:center;justify-content:center;
      border-bottom:1px solid var(--line);
      user-select:none;position:relative;
    }
    .header .back{
      position:absolute;left:14px;font-size:22px;
      color:var(--muted);cursor:pointer;padding:8px;
    }
    .header .title{font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase}

    .wrap{flex:1;overflow:auto;padding:14px 14px 90px}

    /* ── playlist row ── */
    .pl-block{margin-bottom:10px}
    .pl{
      background:var(--card);border:1px solid var(--line);
      border-radius:14px;padding:10px;
      display:flex;align-items:center;gap:10px;
      user-select:none;cursor:pointer;
    }
    .pl.active{
      border-bottom-left-radius:0;border-bottom-right-radius:0;
      border-bottom-color:transparent;
    }
    .pl-cover{
      width:50px;height:50px;border-radius:12px;
      background:#222;overflow:hidden;flex:0 0 50px;
      display:flex;align-items:center;justify-content:center;
      color:var(--muted);font-size:20px;
    }
    .pl-cover img{width:100%;height:100%;object-fit:cover}
    .pl-info{min-width:0;flex:1}
    .pl-name{font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .pl-count{margin-top:2px;color:var(--muted);font-size:12px}
    .pl-actions{display:none;gap:6px;flex:0 0 auto;align-items:center}
    .pl.active .pl-actions{display:flex}
    .pl-btn{
      width:38px;height:38px;border-radius:10px;
      background:var(--btn);border:1px solid var(--line);
      display:flex;align-items:center;justify-content:center;
      font-size:16px;cursor:pointer;
    }
    .pl-btn:active{opacity:.8}

    .pl-dropdown{
      display:none;background:var(--inner);
      border:1px solid var(--line);border-top:none;
      border-bottom-left-radius:14px;border-bottom-right-radius:14px;
      padding:6px 6px 10px;max-height:45vh;overflow:auto;
    }
    .pl-dropdown.open{display:block}

    .trk{
      display:flex;align-items:center;gap:10px;
      padding:9px 10px;border-radius:10px;cursor:pointer;
    }
    .trk:active{background:#1a1a1c}
    .trk-num{width:22px;color:var(--muted);text-align:center;font-size:13px}
    .trk-info{min-width:0;flex:1}
    .trk-title{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .trk-artist{font-size:12px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .trk-dur{color:var(--muted);font-size:12px;flex:0 0 auto}

    .empty{color:var(--muted);text-align:center;padding:20px 10px;line-height:1.6;font-size:13px}

    .fixed-btn{
      position:fixed;left:14px;right:14px;bottom:14px;
      height:54px;border-radius:16px;
      background:var(--btn);border:1px solid var(--line);
      display:flex;align-items:center;justify-content:center;
      font-weight:650;font-size:15px;
      user-select:none;cursor:pointer;z-index:10;
    }

    /* ── catalog track row ── */
    .cat-trk{
      display:flex;align-items:center;gap:10px;
      padding:10px;border-radius:12px;
      background:var(--card);border:1px solid var(--line);
      margin-bottom:8px;cursor:pointer;user-select:none;
    }
    .cat-trk:active{opacity:.85}
    .cat-trk.selected{border-color:#555}
    .cat-trk-cover{
      width:44px;height:44px;border-radius:10px;
      background:#222;overflow:hidden;flex:0 0 44px;
      display:flex;align-items:center;justify-content:center;
      color:var(--muted);font-size:18px;
    }
    .cat-trk-cover img{width:100%;height:100%;object-fit:cover}
    .cat-trk-info{min-width:0;flex:1}
    .cat-trk-title{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cat-trk-artist{font-size:12px;color:var(--muted);margin-top:1px}
    .cat-trk-check{
      width:24px;height:24px;border-radius:50%;
      border:2px solid var(--line);
      flex:0 0 24px;display:flex;align-items:center;
      justify-content:center;font-size:13px;
    }
    .cat-trk.selected .cat-trk-check{
      background:var(--text);border-color:var(--text);color:var(--bg);
    }

    /* ── step 2 (create/edit) ── */
    .s2-cover-pick{
      width:100px;height:100px;border-radius:16px;border:none;
      display:flex;align-items:center;justify-content:center;
      color:#999;cursor:pointer;overflow:hidden;flex:0 0 100px;
      background-image:url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='16' ry='16' stroke='%23999999' stroke-width='2' stroke-dasharray='12%2c 8'/%3e%3c/svg%3e");
    }
    .s2-cover-pick.has-img{background-image:none}
    .s2-cover-pick img{width:100%;height:100%;object-fit:cover;border-radius:16px}

    .s2-top{
      display:flex;gap:14px;align-items:flex-start;
      padding:14px 14px 10px;border-bottom:1px solid var(--line);
    }
    .s2-top-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
    .s2-input{
      width:100%;height:42px;border-radius:12px;
      border:1px solid var(--line);background:#121213;
      color:var(--text);padding:0 12px;outline:none;font-size:15px;
    }
    .s2-desc{
      width:100%;height:50px;border-radius:12px;
      border:1px solid var(--line);background:#121213;
      padding:8px 12px;outline:none;
      font-size:13px;font-family:inherit;resize:none;color:var(--muted);
    }

    .s2-tracks{flex:1;overflow:auto;padding:10px 14px}

    .s2-trk{
      display:flex;align-items:center;gap:10px;
      padding:10px;border-radius:12px;
      background:var(--card);border:1px solid var(--line);
      margin-bottom:8px;cursor:pointer;user-select:none;
    }
    .s2-trk:active{opacity:.85}
    .s2-trk-cover{
      width:42px;height:42px;border-radius:10px;
      background:#222;overflow:hidden;flex:0 0 42px;
      display:flex;align-items:center;justify-content:center;
      color:var(--muted);font-size:18px;
    }
    .s2-trk-cover img{width:100%;height:100%;object-fit:cover}
    .s2-trk-info{min-width:0;flex:1}
    .s2-trk-title{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .s2-trk-artist{font-size:12px;color:var(--muted);margin-top:1px}

    .s2-add-btn{
      display:flex;align-items:center;gap:10px;
      padding:10px;border-radius:12px;
      margin-bottom:8px;cursor:pointer;color:var(--muted);
    }
    .s2-add-icon{
      width:42px;height:42px;border-radius:10px;
      display:flex;align-items:center;justify-content:center;
      font-size:22px;flex:0 0 42px;
      background-image:url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='10' ry='10' stroke='%23555555' stroke-width='2' stroke-dasharray='12%2c 8'/%3e%3c/svg%3e");
    }

    .s2-bottom{
      flex:0 0 auto;padding:10px 14px 14px;
      border-top:1px solid var(--line);
      display:flex;flex-direction:column;gap:8px;
    }
    .s2-actions{display:flex;gap:10px}
    .btn{
      flex:1;height:46px;border-radius:14px;
      border:1px solid var(--line);background:var(--btn);
      color:var(--text);font-weight:650;font-size:14px;cursor:pointer;
    }
    .btn:active{opacity:.9}
    .btn.primary{background:#2a2a2d}
    .btn.danger{border-color:#3a2a2a;color:var(--danger)}
    .err{color:var(--danger);font-size:12px;text-align:center;min-height:16px;margin-top:2px}

    /* long press confirm */
    .confirm-del{
      position:fixed;left:16px;right:16px;bottom:80px;
      background:#2a1a1a;border:1px solid #5a2a2a;
      border-radius:14px;padding:14px;
      display:none;z-index:100;flex-direction:column;gap:10px;
    }
    .confirm-del.show{display:flex}
    .confirm-del-text{font-size:14px;color:var(--text);text-align:center}
    .confirm-del-btns{display:flex;gap:10px}
  </style>
</head>
<body>

<!-- ════════════════════════════
  Screen 1: Плейлисты (вкладка 1)
════════════════════════════ -->
<div class="screen active" id="s1">
  <div class="tabs">
    <div class="tab active" id="tabPlaylists" onclick="switchTab('playlists')">Плейлисты</div>
    <div class="tab" id="tabCatalog" onclick="switchTab('catalog')">Все треки</div>
  </div>

  <!-- вкладка Плейлисты -->
  <div id="panelPlaylists" style="flex:1;display:flex;flex-direction:column;overflow:hidden">
    <div class="wrap" id="list"></div>
    <div class="fixed-btn" id="btnCreate">+ Создать плейлист</div>
  </div>

  <!-- вкладка Все треки -->
  <div id="panelCatalog" style="flex:1;display:none;flex-direction:column;overflow:hidden">
    <div class="wrap" id="catalogList"></div>
    <div class="fixed-btn" id="btnLoadTracks">Загрузить треки</div>
  </div>
</div>

<!-- ════════════════════════════
  Screen 2: Создать / Редактировать плейлист
════════════════════════════ -->
<div class="screen" id="s2">
  <div class="header">
    <span class="back" id="s2Back">‹</span>
    <div class="title" id="s2Title">Новый плейлист</div>
  </div>

  <div class="s2-top">
    <div class="s2-cover-pick" id="s2CoverPick">
      <div style="font-size:30px" id="s2CoverPlus">+</div>
      <img id="s2CoverImg" style="display:none" />
    </div>
    <div class="s2-top-info">
      <input type="text" class="s2-input" id="s2NameInput" placeholder="Название плейлиста" />
      <textarea class="s2-desc" id="s2DescInput" placeholder="Описание (необязательно)"></textarea>
      <div class="err" id="s2Err"></div>
    </div>
  </div>

  <div class="s2-tracks" id="s2TracksList"></div>

  <div class="s2-bottom">
    <div class="s2-actions">
      <button class="btn danger" id="s2Cancel">Отмена</button>
      <button class="btn primary" id="s2Save">Создать</button>
    </div>
  </div>
</div>

<!-- ════════════════════════════
  Screen 3: Все треки в режиме выбора треков
════════════════════════════ -->
<div class="screen" id="s3">
  <div class="header">
    <span class="back" id="s3Back">‹</span>
    <div class="title">Выбрать треки</div>
  </div>
  <div class="wrap" id="s3List"></div>
  <div class="fixed-btn" id="s3Apply">Добавить выбранные</div>
</div>

<input id="s2CoverFile" type="file" accept="image/*" style="display:none" />

<!-- long press confirm delete track (s2) -->
<div class="confirm-del" id="confirmDel">
  <div class="confirm-del-text" id="confirmDelText">Удалить трек?</div>
  <div class="confirm-del-btns">
    <button class="btn" id="confirmDelNo">Отмена</button>
    <button class="btn danger" id="confirmDelYes">Удалить</button>
  </div>
</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const API_BASE = "https://music-player-server-jjkm.onrender.com";

  let playlists = {};
  let catalog   = [];
  let openPl    = null;

  // s2 state
  let s2Mode   = "create";
  let s2PlName = null;
  let s2Tracks = [];
  let s2Cover  = null;
  let s2DelIdx = null;
  let longTimer = null;

  // s3 state (catalog select mode)
  let s3Selected = new Set(); // file_ids

  function qs(id){ return document.getElementById(id) }

  function fmt(sec){
    sec=Math.floor(sec||0);
    return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;
  }

  async function apiGet(path){
    const sep=path.includes("?")?"&":"?";
    const r=await fetch(API_BASE+path+sep+"init_data="+encodeURIComponent(tg.initData));
    return await r.json();
  }
  async function apiPost(path,body){
    const r=await fetch(API_BASE+path+"?init_data="+encodeURIComponent(tg.initData),{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(body||{})
    });
    return await r.json();
  }
  async function apiDelete(path,body){
    const r=await fetch(API_BASE+path+"?init_data="+encodeURIComponent(tg.initData),{
      method:"DELETE",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(body||{})
    });
    return await r.json();
  }

  function showScreen(id){
    document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
  }

  // ── вкладки ──
  let currentTab = "playlists";

  function switchTab(tab){
    currentTab = tab;
    qs("tabPlaylists").classList.toggle("active", tab==="playlists");
    qs("tabCatalog").classList.toggle("active", tab==="catalog");
    qs("panelPlaylists").style.display = tab==="playlists" ? "flex" : "none";
    qs("panelCatalog").style.display   = tab==="catalog"   ? "flex" : "none";
    if(tab==="catalog") loadCatalog();
  }

  // ══════════════════════════════
  //  Плейлисты
  // ══════════════════════════════
  async function load(){
    qs("list").innerHTML=`<div class="empty">Загрузка…</div>`;
    playlists = await apiGet("/api/playlists");
    renderPlaylists();
  }

  function renderPlaylists(){
    const list=qs("list");
    const names=Object.keys(playlists||{});
    if(!names.length){
      list.innerHTML=`<div class="empty">Плейлисты не найдены</div>`;
      return;
    }
    list.innerHTML="";
    names.forEach(name=>{
      const pl=playlists[name];
      const tracks=pl.tracks||[];
      const isOpen=openPl===name;

      const block=document.createElement("div");
      block.className="pl-block";

      const row=document.createElement("div");
      row.className="pl"+(isOpen?" active":"");

      const cover=document.createElement("div");
      cover.className="pl-cover";
      if(pl.cover_url){
        const img=document.createElement("img");img.src=pl.cover_url;
        cover.appendChild(img);
      } else { cover.textContent="♪"; }

      const info=document.createElement("div");
      info.className="pl-info";
      info.innerHTML=`<div class="pl-name">${name}</div><div class="pl-count">${tracks.length} тр.</div>`;

      const actions=document.createElement("div");
      actions.className="pl-actions";

      const btnEdit=document.createElement("div");
      btnEdit.className="pl-btn";
      btnEdit.textContent="✏️";
      btnEdit.onclick=(e)=>{ e.stopPropagation(); openEditScreen(name); };

      const btnDel=document.createElement("div");
      btnDel.className="pl-btn";
      btnDel.textContent="🗑️";
      btnDel.onclick=async(e)=>{
        e.stopPropagation();
        if(confirm(`Удалить «${name}»?`)){
          await apiDelete(`/api/playlist/${encodeURIComponent(name)}`);
          openPl=null; await load();
        }
      };

      actions.appendChild(btnEdit);
      actions.appendChild(btnDel);
      row.appendChild(cover);
      row.appendChild(info);
      row.appendChild(actions);

      row.onclick=()=>{
        openPl=openPl===name?null:name;
        renderPlaylists();
      };

      block.appendChild(row);

      const dd=document.createElement("div");
      dd.className="pl-dropdown"+(isOpen?" open":"");
      if(isOpen){
        if(!tracks.length){
          dd.innerHTML=`<div class="empty">Плейлист пустой</div>`;
        } else {
          tracks.forEach((t,i)=>{
            const trk=document.createElement("div");
            trk.className="trk";
            trk.innerHTML=`
              <div class="trk-num">${i+1}</div>
              <div class="trk-info">
                <div class="trk-title">${t.title||"Track"}</div>
                <div class="trk-artist">${t.artist||""}</div>
              </div>
              <div class="trk-dur">${fmt(t.duration)}</div>
            `;
            trk.onclick=(e)=>{
              e.stopPropagation();
              if(t.audio_url) new Audio(t.audio_url).play().catch(()=>{});
            };
            dd.appendChild(trk);
          });
        }
      }
      block.appendChild(dd);
      list.appendChild(block);
    });
  }

  // ══════════════════════════════
  //  Все треки
  // ══════════════════════════════
  async function loadCatalog(){
    qs("catalogList").innerHTML=`<div class="empty">Загрузка…</div>`;
    catalog = await apiGet("/api/catalog");
    renderCatalog();
  }

  function renderCatalog(){
    const box=qs("catalogList");
    if(!catalog.length){
      box.innerHTML=`<div class="empty">Каталог пуст.<br><br>Отправьте аудио боту, затем нажмите «Загрузить треки».</div>`;
      return;
    }
    box.innerHTML="";
    catalog.forEach(t=>{
      const div=document.createElement("div");
      div.className="cat-trk";

      const cvr=document.createElement("div");
      cvr.className="cat-trk-cover";
      if(t.thumb_url){
        const img=document.createElement("img");img.src=t.thumb_url;cvr.appendChild(img);
      } else { cvr.textContent="♪"; }

      const info=document.createElement("div");
      info.className="cat-trk-info";
      info.innerHTML=`<div class="cat-trk-title">${t.title||"Track"}</div><div class="cat-trk-artist">${t.artist||""}</div>`;

      div.appendChild(cvr);
      div.appendChild(info);
      box.appendChild(div);
    });
  }

  // Загрузить треки из бота в Каталог
  qs("btnLoadTracks").onclick=async()=>{
    qs("btnLoadTracks").textContent="Загрузка…";
    const res=await apiPost("/api/catalog/load",{});
    qs("btnLoadTracks").textContent="Загрузить треки";
    catalog = await apiGet("/api/catalog");
    renderCatalog();
    if(res.added===0){
      alert("Нет новых треков. Сначала отправьте аудио боту.");
    }
  };

  // ══════════════════════════════
  //  Screen 2 — Create / Edit
  // ══════════════════════════════
  function openCreateScreen(){
    s2Mode="create"; s2PlName=null; s2Tracks=[]; s2Cover=null;
    qs("s2Title").textContent="Новый плейлист";
    qs("s2Save").textContent="Создать";
    qs("s2NameInput").value="";
    qs("s2DescInput").value="";
    qs("s2Err").textContent="";
    qs("s2CoverImg").style.display="none";
    qs("s2CoverPlus").style.display="block";
    qs("s2CoverPick").classList.remove("has-img");
    renderS2Tracks();
    showScreen("s2");
  }

  function openEditScreen(name){
    s2Mode="edit"; s2PlName=name;
    const pl=playlists[name];
    s2Tracks=(pl.tracks||[]).map(t=>({...t}));
    s2Cover=null;
    qs("s2Title").textContent="Редактирование";
    qs("s2Save").textContent="Сохранить";
    qs("s2NameInput").value=name;
    qs("s2DescInput").value="";
    qs("s2Err").textContent="";
    if(pl.cover_url){
      qs("s2CoverImg").src=pl.cover_url;
      qs("s2CoverImg").style.display="block";
      qs("s2CoverPlus").style.display="none";
      qs("s2CoverPick").classList.add("has-img");
    } else {
      qs("s2CoverImg").style.display="none";
      qs("s2CoverPlus").style.display="block";
      qs("s2CoverPick").classList.remove("has-img");
    }
    renderS2Tracks();
    showScreen("s2");
  }

  function renderS2Tracks(){
    const box=qs("s2TracksList");
    box.innerHTML="";

    s2Tracks.forEach((t,i)=>{
      const div=document.createElement("div");
      div.className="s2-trk";
      div.onpointerdown=()=>{ longTimer=setTimeout(()=>showDelConfirm(i,t.title),600); };
      div.onpointerup=()=>clearTimeout(longTimer);
      div.onpointerleave=()=>clearTimeout(longTimer);

      const cvr=document.createElement("div");
      cvr.className="s2-trk-cover";
      if(t.thumb_url){
        const img=document.createElement("img");img.src=t.thumb_url;cvr.appendChild(img);
      } else { cvr.textContent="♪"; }

      const info=document.createElement("div");
      info.className="s2-trk-info";
      info.innerHTML=`<div class="s2-trk-title">${t.title||"Track"}</div><div class="s2-trk-artist">${t.artist||""}</div>`;

      div.appendChild(cvr);
      div.appendChild(info);
      box.appendChild(div);
    });

    // кнопка добавить трек → открыть Все треки
    const addBtn=document.createElement("div");
    addBtn.className="s2-add-btn";
    addBtn.innerHTML=`<div class="s2-add-icon">+</div><div style="font-size:14px">Добавить трек</div>`;
    addBtn.onclick=()=>openCatalogSelect();
    box.appendChild(addBtn);
  }

  function showDelConfirm(index,title){
    s2DelIdx=index;
    qs("confirmDelText").textContent=`Удалить «${title||"трек"}»?`;
    qs("confirmDel").classList.add("show");
  }
  function hideDelConfirm(){
    qs("confirmDel").classList.remove("show");
    s2DelIdx=null;
  }
  qs("confirmDelNo").onclick=hideDelConfirm;
  qs("confirmDelYes").onclick=()=>{
    if(s2DelIdx!==null){ s2Tracks.splice(s2DelIdx,1); renderS2Tracks(); }
    hideDelConfirm();
  };

  qs("s2CoverPick").onclick=()=>qs("s2CoverFile").click();
  qs("s2CoverFile").onchange=(e)=>{
    const f=e.target.files&&e.target.files[0];
    if(!f) return;
    s2Cover=f;
    qs("s2CoverImg").src=URL.createObjectURL(f);
    qs("s2CoverImg").style.display="block";
    qs("s2CoverPlus").style.display="none";
    qs("s2CoverPick").classList.add("has-img");
  };

  qs("s2Back").onclick=()=>{ showScreen("s1"); load(); };
  qs("s2Cancel").onclick=()=>{ showScreen("s1"); load(); };

  qs("s2Save").onclick=async()=>{
    const newName=qs("s2NameInput").value.trim();
    if(!newName){ qs("s2Err").textContent="Название обязательно"; return; }

    if(s2Mode==="create"){
      const r=await apiPost("/api/playlist",{name:newName});
      if(r.error){ qs("s2Err").textContent=r.error; return; }
    } else if(newName!==s2PlName){
      await apiPost(`/api/playlist/${encodeURIComponent(s2PlName)}/rename`,{new_name:newName});
    }

    const current=await apiGet("/api/playlists");
    const existing=(current[newName]&&current[newName].tracks)||[];
    const existingIds=new Set(existing.map(t=>t.file_id));

    for(const t of s2Tracks){
      if(!existingIds.has(t.file_id)){
        await apiPost(`/api/playlist/${encodeURIComponent(newName)}/add_track`,{track:t});
      }
    }

    showScreen("s1");
    await load();
  };

  // ══════════════════════════════
  //  Screen 3 — Все треки (выбор)
  // ══════════════════════════════
  function openCatalogSelect(){
    s3Selected=new Set(s2Tracks.map(t=>t.file_id));
    renderS3();
    showScreen("s3");
  }

  function renderS3(){
    const box=qs("s3List");
    if(!catalog.length){
      box.innerHTML=`<div class="empty">Каталог пуст.<br><br>Сначала загрузите треки через вкладку «Все треки».</div>`;
      return;
    }
    box.innerHTML="";
    catalog.forEach(t=>{
      const div=document.createElement("div");
      const sel=s3Selected.has(t.file_id);
      div.className="cat-trk"+(sel?" selected":"");

      const cvr=document.createElement("div");
      cvr.className="cat-trk-cover";
      if(t.thumb_url){
        const img=document.createElement("img");img.src=t.thumb_url;cvr.appendChild(img);
      } else { cvr.textContent="♪"; }

      const info=document.createElement("div");
      info.className="cat-trk-info";
      info.innerHTML=`<div class="cat-trk-title">${t.title||"Track"}</div><div class="cat-trk-artist">${t.artist||""}</div>`;

      const check=document.createElement("div");
      check.className="cat-trk-check";
      if(sel) check.textContent="✓";

      div.appendChild(cvr);
      div.appendChild(info);
      div.appendChild(check);

      div.onclick=()=>{
        if(s3Selected.has(t.file_id)){
          s3Selected.delete(t.file_id);
        } else {
          s3Selected.add(t.file_id);
        }
        renderS3();
      };

      box.appendChild(div);
    });
  }

  qs("s3Back").onclick=()=>showScreen("s2");

  qs("s3Apply").onclick=()=>{
    const toAdd=catalog.filter(t=>s3Selected.has(t.file_id));
    const existingIds=new Set(s2Tracks.map(t=>t.file_id));
    toAdd.forEach(t=>{
      if(!existingIds.has(t.file_id)) s2Tracks.push({...t});
    });
    renderS2Tracks();
    showScreen("s2");
  };

  // ── init ──
  qs("btnCreate").onclick=openCreateScreen;
  load();
  loadCatalog();
</script>
</body>
</html>
